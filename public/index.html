<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="build-id" content="{{BUILD_ID}}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND_NAME}}</title>
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:site_name" content="{{BRAND_NAME}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PAGE_URL}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="arena-base" content="{{CANONICAL_URL}}">
<meta name="arena-brand" content="{{BRAND_NAME}}">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{gold:'#FFD700'}}}}</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="/upload.css?v={{BUILD_ID}}">
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
  [hidden]{display:none!important}
  .txs{text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .ico svg{width:100%;height:100%}
  .rail-btn.on svg{fill:#ff2d55;stroke:#ff2d55}
  .rail-btn.saved svg{fill:#FFD700;stroke:#FFD700}
  .tab.active{color:#fbbf24}.tab{color:rgba(255,255,255,.65)}
  svg.lucide{stroke-width:2}
  .glass{background:rgba(20,20,20,.65);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  @keyframes dotpulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.7)}70%{box-shadow:0 0 0 7px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
  .dot-pulse{animation:dotpulse 1.8s infinite}
  .slide-up{animation:slu .28s ease-out}.slide-down{animation:sld .28s ease-out}
  @keyframes slu{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sld{from{transform:translateY(-100%)}to{transform:none}}
  .up-sheet,.sh-sheet{z-index:75}
  #hdr.bare{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:0}
  #hdr.bare #search-form{display:none}
</style>
</head>
<body>
<div id="phone" class="relative mx-auto h-[100dvh] w-full max-w-[480px] overflow-hidden bg-black text-white font-sans">

  <!-- Media: real clip from R2 (poster first, then the video) -->
  <img id="poster" alt="" class="absolute inset-0 h-full w-full object-cover hidden">
  <video id="vid" class="absolute inset-0 h-full w-full object-cover" autoplay loop muted playsinline webkit-playsinline preload="metadata"></video>
  <div class="pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/60 to-transparent"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-72 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
  <div id="empty" class="absolute inset-0 hidden items-center justify-center px-8 text-center text-white/80">Aucun clip pour le moment. Appuyez sur Importer pour publier le premier.</div>

  <!-- Header: Home (+ Back on every page but the feed) | logo -> Feed | Importer, then the one search bar -->
  <header id="hdr" class="glass absolute inset-x-0 top-0 z-[65] px-3 pb-2 pt-[calc(env(safe-area-inset-top)+8px)]">
    <div class="grid h-12 grid-cols-[1fr_auto_1fr] items-center">
      <div class="flex items-center gap-1 justify-self-start">
        <button id="b-back" hidden aria-label="Retour" class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10"><i data-lucide="arrow-left" class="h-6 w-6"></i></button>
        <button id="b-home" aria-label="Accueil" class="flex h-11 w-11 items-center justify-center rounded-full bg-white/10"><i data-lucide="house" class="h-6 w-6"></i></button>
      </div>
      <button id="logo" aria-label="Arena Clips, retour au fil" class="flex items-center gap-1 text-xl font-extrabold tracking-tight"><span class="text-white">Arena</span><span class="text-amber-400">Clips</span><span class="dot-pulse ml-0.5 h-2 w-2 rounded-full bg-amber-400"></span></button>
      <button id="up-open" aria-label="Importer" class="flex h-10 items-center gap-1.5 justify-self-end rounded-full bg-amber-400 px-3 text-sm font-bold text-black"><i data-lucide="upload" class="h-4 w-4"></i>Importer</button>
    </div>
    <form id="search-form" role="search" action="javascript:void(0)" class="mt-1 flex h-10 items-center gap-2 rounded-full bg-white/10 px-3">
      <i data-lucide="search" class="h-5 w-5 shrink-0"></i>
      <input id="q" type="search" placeholder="Titre, légende, #tag ou créateur" enterkeyhint="search" autocomplete="off" aria-label="Recherche" class="min-w-0 flex-1 bg-transparent text-sm text-white placeholder-white/70 outline-none">
      <button id="q-clear" type="button" hidden aria-label="Effacer la recherche" class="flex h-7 w-7 items-center justify-center rounded-full bg-white/20 text-xs">✕</button>
    </form>
  </header>

  <button id="v-x" hidden aria-label="Fermer la vidéo" class="absolute left-3 top-[calc(env(safe-area-inset-top)+68px)] z-[35] flex h-11 w-11 items-center justify-center rounded-full bg-black/60 text-lg ring-1 ring-white/30">✕</button>
  <button id="r-snd" aria-label="Son" class="rail-btn absolute right-3 top-[calc(env(safe-area-inset-top)+68px)] z-[30] flex h-9 w-9 items-center justify-center rounded-full bg-black/45"><i data-lucide="volume-x" class="h-5 w-5"></i></button>
  <button id="replay" hidden aria-label="Revoir" class="absolute left-1/2 top-[42%] z-[30] flex -translate-x-1/2 -translate-y-1/2 items-center gap-2 rounded-full bg-black/70 px-6 py-3 text-base font-extrabold ring-1 ring-white/40"><i data-lucide="rotate-ccw" class="h-5 w-5"></i>Revoir</button>

  <!-- Right rail: Like, Comment, Share, Save (all stored in the database) -->
  <aside class="absolute right-3 z-20 flex flex-col items-center gap-4 bottom-[calc(env(safe-area-inset-bottom)+124px)]">
    <button id="r-like" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="J'aime"><i data-lucide="heart" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-comment" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Commentaires"><i data-lucide="message-circle" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-share" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Partager"><i data-lucide="share-2" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-save" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Enregistrer"><i data-lucide="bookmark" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
  </aside>

  <!-- Bottom: creator + Follow (one place), caption, music, tools, navigation -->
  <section class="absolute inset-x-0 z-20 px-3 bottom-[calc(env(safe-area-inset-bottom)+116px)] pr-16">
    <div class="flex items-center gap-2">
      <button id="author-btn" aria-label="Voir le profil" class="flex min-w-0 items-center gap-2 text-left">
        <span id="avatar" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-white bg-amber-400 text-sm font-extrabold text-black">AC</span>
        <span class="min-w-0 leading-tight"><span id="author" class="block truncate text-[15px] font-bold txs"></span><span id="handle" class="block truncate text-xs text-white/75 txs"></span></span>
      </button>
      <button id="follow" class="ml-1 shrink-0 rounded-full border border-white px-3 py-1 text-xs font-bold">Suivre</button>
    </div>
    <p class="mt-2 line-clamp-2 text-sm leading-snug txs"><b id="c-title" class="font-extrabold"></b> <span id="caption"></span></p>
  </section>

  <div class="absolute left-3 z-20 flex gap-2 bottom-[calc(env(safe-area-inset-bottom)+72px)]">
    <button id="t-card" aria-label="Citizen Card" title="Citizen Card" class="flex h-9 w-9 items-center justify-center rounded-full bg-black/45 ring-1 ring-white/20"><i data-lucide="id-card" class="h-[18px] w-[18px]"></i></button>
    <button id="t-msg" aria-label="Message" title="Message" class="flex h-9 w-9 items-center justify-center rounded-full bg-black/45 ring-1 ring-white/20"><i data-lucide="send" class="h-[18px] w-[18px]"></i></button>
    <button id="t-ai" aria-label="Ask AI" title="Ask AI" class="flex h-9 w-9 items-center justify-center rounded-full bg-black/45 ring-1 ring-white/20"><i data-lucide="sparkles" class="h-[18px] w-[18px] text-gold"></i></button>
  </div>

  <nav class="absolute inset-x-0 bottom-0 z-40 flex h-[calc(64px+env(safe-area-inset-bottom))] items-start border-t border-white/10 bg-black/70 pb-[env(safe-area-inset-bottom)] backdrop-blur">
    <button class="tab active flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="home"><i data-lucide="house" class="h-6 w-6"></i>Accueil</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="search"><i data-lucide="search" class="h-6 w-6"></i>Recherche</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="clips"><i data-lucide="clapperboard" class="h-6 w-6"></i>Clips</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="messages"><span class="relative"><i data-lucide="mail" class="h-6 w-6"></i><span id="msg-badge" hidden class="absolute -right-2 -top-1 min-w-[16px] rounded-full bg-red-500 px-1 text-center text-[10px] font-extrabold leading-4 text-white">0</span></span>Messages</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="profile"><i data-lucide="user-round" class="h-6 w-6"></i>Profil</button>
  </nav>

  <!-- Pages: Recherche, Clips, Messages, Profil -->
  <main id="page" hidden class="absolute inset-x-0 bottom-[calc(64px+env(safe-area-inset-bottom))] top-[calc(env(safe-area-inset-top)+116px)] overflow-y-auto bg-neutral-950 p-4" style="z-index:45"></main>

  <!-- Modal layer (comments, citizen card, message, Ask AI, menu, share toast) -->
  <div id="back" hidden class="absolute inset-0 z-[66] bg-black/60"></div>
  <div id="modal" hidden class="absolute inset-x-0 bottom-0 z-[70] max-h-[85%] overflow-y-auto rounded-t-3xl bg-neutral-900 p-4 pb-[calc(env(safe-area-inset-bottom)+16px)] shadow-2xl"></div>
  <div id="toast" hidden class="absolute inset-x-4 bottom-[calc(env(safe-area-inset-bottom)+130px)] z-[80] rounded-xl bg-gold px-4 py-2.5 text-center text-sm font-bold text-black"></div>

  <!-- Importer (upload studio, handled by upload.js) -->
  <div class="up-sheet" id="up-sheet" hidden>
    <div class="up-head"><span id="up-title">Nouveau clip</span><button id="up-close" aria-label="Fermer">✕</button></div>
    <div class="st-step" id="st-1">
      <label class="up-pick" id="up-pick">Choisir un fichier vidéo<input type="file" id="up-file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden></label>
    </div>
    <div class="st-step" id="st-2" hidden>
      <video id="st-prev" class="st-prev" playsinline controls loop></video>
      <div class="st-lbl">Titre (obligatoire)</div>
      <input id="st-title" maxlength="120" placeholder="Titre du clip" autocomplete="off">
      <div class="st-lbl">Description</div>
      <textarea id="st-desc" placeholder="Description…"></textarea>
      <div class="st-lbl">Commentaire</div>
      <textarea id="st-comment" placeholder="Commentaire…"></textarea>
      <div class="st-lbl">Musique</div>
      <div class="st-music">
        <button id="st-music-btn">♫ Choisir une musique</button>
        <button id="st-music-del" hidden title="Supprimer la musique">🗑</button>
      </div>
      <div class="mu-panel" id="mu-panel" hidden>
        <input id="mu-q" type="search" placeholder="Rechercher une musique…">
        <div class="mu-list" id="mu-list"></div>
      </div>
      <div class="ai">
        <div class="ai-title">✨ Assistant IA</div>
        <div class="ai-reply" id="ai-reply">Analyse de la vidéo…</div>
        <div class="ai-list" id="ai-list"></div>
        <div class="ai-chips">
          <button data-q="Propose-moi une description">Description</button>
          <button data-q="Propose-moi un commentaire">Commentaire</button>
          <button data-q="Améliore l'image">Améliorer l'image</button>
          <button data-q="Quelle musique conviendrait ?">Musique</button>
          <button data-q="Transforme la vidéo en cartoon">Cartoon</button>
          <button data-q="Incarne un personnage">Personnage</button>
        </div>
        <div class="ai-ask"><input id="ai-q" placeholder="Demandez à l'IA…"><button id="ai-mic" title="Dictée vocale">🎤</button><button id="ai-send" title="Envoyer">➤</button></div>
      </div>
      <button class="st-pub" id="st-pub">Publier</button>
    </div>
    <div class="up-track"><div id="up-bar"></div></div>
    <div id="up-label"></div>
    <div id="up-result"></div>
  </div>
</div>

<script defer src="/app.js?v={{BUILD_ID}}"></script>
<script type="module" src="/upload.js?v={{BUILD_ID}}"></script>
</body>
</html>
