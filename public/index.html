<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="build-id" content="{{BUILD_ID}}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{{BRAND_NAME}}</title>
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:site_name" content="{{BRAND_NAME}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PAGE_URL}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="arena-base" content="{{CANONICAL_URL}}">
<meta name="arena-brand" content="{{BRAND_NAME}}">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{gold:'#FFD700'}}}}</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="/upload.css?v={{BUILD_ID}}">
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
  [hidden]{display:none!important}
  .txs{text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .ico svg{width:100%;height:100%}
  .rail-btn.on svg{fill:#ff2d55;stroke:#ff2d55}
  .rail-btn.saved svg,.rail-btn.fav svg{fill:#FFD700;stroke:#FFD700}
  #l-rail{position:fixed;z-index:30;left:max(12px,calc(50vw - 240px + 12px));top:calc(env(safe-area-inset-top) + 96px)}
  .tab.active{color:#fbbf24}.tab{color:rgba(255,255,255,.65)}
  svg.lucide{stroke-width:2}
  .glass{background:rgba(20,20,20,.65);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  @keyframes dotpulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.7)}70%{box-shadow:0 0 0 7px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
  .dot-pulse{animation:dotpulse 1.8s infinite}
  .slide-up{animation:slu .28s ease-out}.slide-down{animation:sld .28s ease-out}
  @keyframes slu{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sld{from{transform:translateY(-100%)}to{transform:none}}
  .up-sheet,.sh-sheet{z-index:75}
  #hdr.bare{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:0}
  #hdr.bare #search-form{display:none}
  #hdr{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:9999}
  #phone{height:var(--vh,100dvh)}
  #hdr.bare ~ #b-tools{top:calc(env(safe-area-inset-top) + 50px)}
  #page{padding-top:32px!important}
  #vid,#vid2{transform-origin:center center}
  .invisible{visibility:hidden}
</style>
</head>
<body>
<div id="phone" class="relative mx-auto w-full max-w-[480px] overflow-hidden bg-black text-white font-sans">

  <!-- Media: real clip from R2 (poster first, then the video) -->
  <img id="poster" alt="" class="absolute inset-0 h-full w-full object-cover hidden">
  <video id="vid" class="absolute inset-0 h-full w-full object-cover" muted playsinline webkit-playsinline preload="metadata"></video>
  <div id="acc-ov" class="pointer-events-none absolute left-1/2 top-[38%] z-10 -translate-x-1/2 whitespace-nowrap text-5xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/60 to-transparent"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-72 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
  <div id="empty" class="absolute inset-0 hidden items-center justify-center px-8 text-center text-white/80">Aucun clip pour le moment. Appuyez sur Importer pour publier le premier.</div>

  <!-- Fixed top bar on every page: [ < ] [ Home ] [ Arena Clips ] [ > ] [ X ], then the one search bar + Importer -->
  <header id="hdr" class="glass px-2 pb-2 pt-[calc(env(safe-area-inset-top)+6px)]">
    <div class="flex h-11 items-center gap-1.5">
      <button id="b-prev" aria-label="Précédent" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 aria-disabled:opacity-30"><i data-lucide="chevron-left" class="h-6 w-6"></i></button>
      <button id="b-home" aria-label="Accueil" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 aria-disabled:opacity-30"><i data-lucide="house" class="h-5 w-5"></i></button>
      <button id="logo" aria-label="Arena Clips, retour au fil" class="flex min-w-0 flex-1 items-center justify-center gap-1 text-lg font-extrabold tracking-tight"><span class="text-white">Arena</span><span class="text-amber-400">Clips</span><span class="dot-pulse ml-0.5 h-2 w-2 rounded-full bg-amber-400"></span></button>
      <button id="b-next" aria-label="Suivant" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 aria-disabled:opacity-30"><i data-lucide="chevron-right" class="h-6 w-6"></i></button>
      <button id="b-x" aria-label="Fermer" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 aria-disabled:opacity-30"><i data-lucide="x" class="h-5 w-5"></i></button>
    </div>
    <div class="mt-1 flex items-center justify-end gap-2">
      <form id="search-form" role="search" action="javascript:void(0)" class="flex h-10 min-w-0 flex-1 items-center gap-2 rounded-full bg-white/10 px-3">
        <i data-lucide="search" class="h-5 w-5 shrink-0"></i>
        <input id="q" type="search" placeholder="Titre, légende, #tag ou créateur" enterkeyhint="search" autocomplete="off" aria-label="Recherche" class="min-w-0 flex-1 bg-transparent text-sm text-white placeholder-white/70 outline-none">
        <button id="q-clear" type="button" hidden aria-label="Effacer la recherche" class="flex h-7 w-7 items-center justify-center rounded-full bg-white/20 text-xs">✕</button>
      </form>
      <button id="up-open" aria-label="Importer" class="flex h-10 shrink-0 items-center gap-1.5 rounded-full bg-amber-400 px-3 text-sm font-bold text-black"><i data-lucide="upload" class="h-4 w-4"></i>Importer</button>
    </div>
  </header>
  <!-- Toolbox button: directly under Home -->
  <button id="b-tools" aria-label="Boîte à outils" title="Boîte à outils" class="absolute left-[54px] top-[calc(env(safe-area-inset-top)+96px)] z-[50] flex h-10 w-10 items-center justify-center rounded-full bg-white/25 ring-2 ring-white/70 shadow-lg"><i data-lucide="ellipsis-vertical" class="h-5 w-5 text-white"></i></button>
  <button id="r-snd" aria-label="Son" class="rail-btn absolute right-3 top-[calc(env(safe-area-inset-top)+112px)] z-[30] flex h-9 w-9 items-center justify-center rounded-full bg-black/45"><i data-lucide="volume-x" class="h-5 w-5"></i></button>
  <button id="replay" hidden aria-label="Revoir" class="absolute left-1/2 top-[42%] z-[30] flex -translate-x-1/2 -translate-y-1/2 items-center gap-2 rounded-full bg-black/70 px-6 py-3 text-base font-extrabold ring-1 ring-white/40"><i data-lucide="rotate-ccw" class="h-5 w-5"></i>Revoir</button>

  <!-- Right rail: Like, Comment, Share, Save (all stored in the database) -->
  <aside class="absolute right-3 z-20 flex flex-col items-center gap-4 bottom-[calc(env(safe-area-inset-bottom)+124px)]">
    <button id="r-like" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="J'aime"><i data-lucide="heart" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-comment" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Commentaires"><i data-lucide="message-circle" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-share" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Partager"><i data-lucide="share-2" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
    <button id="r-save" class="rail-btn flex w-11 flex-col items-center gap-0.5" aria-label="Enregistrer"><i data-lucide="bookmark" class="h-6 w-6"></i><span class="text-[11px] font-bold txs" data-n>0</span></button>
  </aside>

  <!-- Left rail, vertical, under the Toolbox button: Title/Caption, Favorite (my profile and Settings sit in the creator row at the bottom) -->
  <aside id="l-rail" class="flex flex-col items-center gap-3">
    <button id="l-cap" aria-label="Titre et légende" class="rail-btn flex h-10 w-10 items-center justify-center rounded-full bg-black/55 ring-1 ring-white/25"><i data-lucide="type" class="h-5 w-5"></i></button>
    <button id="l-fav" aria-label="Favori" aria-pressed="false" class="rail-btn flex h-10 w-10 items-center justify-center rounded-full bg-black/55 ring-1 ring-white/25"><i data-lucide="star" class="h-5 w-5"></i></button>
    <button id="t-card" aria-label="Citizen Card" title="Citizen Card" class="flex h-10 w-10 items-center justify-center rounded-full rail-btn bg-black/55 ring-1 ring-white/25"><i data-lucide="id-card" class="h-5 w-5"></i></button>
    <button id="t-msg" aria-label="Message" title="Message" class="flex h-10 w-10 items-center justify-center rounded-full rail-btn bg-black/55 ring-1 ring-white/25"><i data-lucide="send" class="h-5 w-5"></i></button>
    <button id="t-ai" aria-label="Ask AI" title="Ask AI" class="flex h-10 w-10 items-center justify-center rounded-full rail-btn bg-black/55 ring-1 ring-white/25"><i data-lucide="sparkles" class="h-5 w-5 text-gold"></i></button>
  </aside>

  <!-- Bottom: creator + Follow (one place), caption, music, tools, navigation -->
  <section class="absolute inset-x-0 z-20 px-3 bottom-[calc(env(safe-area-inset-bottom)+116px)] pr-16">
    <div class="flex items-center gap-2">
      <button id="author-btn" aria-label="Voir le profil" class="flex min-w-0 items-center gap-2 text-left">
        <span id="avatar" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-white bg-amber-400 text-sm font-extrabold text-black">AC</span>
        <span class="min-w-0 leading-tight"><span id="author" class="block truncate text-[15px] font-bold txs"></span><span id="handle" class="block truncate text-xs text-white/75 txs"></span></span>
      </button>
      <button id="follow" class="ml-1 shrink-0 rounded-full border border-white px-3 py-1 text-xs font-bold">Suivre</button>
    </div>
    <p class="mt-2 line-clamp-2 text-sm leading-snug txs"><b id="c-title" class="font-extrabold"></b> <span id="caption"></span></p>
  </section>


  <!-- Views: real count from the database, bottom-right above Profil -->
  <div id="eye-row" class="absolute right-3 z-20 flex items-center gap-2 bottom-[calc(env(safe-area-inset-bottom)+68px)]">
    <div id="views" class="flex shrink-0 items-center gap-1 rounded-full bg-black/45 px-2.5 py-1 text-xs font-bold ring-1 ring-white/20" aria-label="Vues"><span aria-hidden="true">👁️</span><span id="views-n">0</span></div>
  <button id="l-eq" aria-label="Mon profil" class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full border-2 border-white bg-amber-400 text-xs font-extrabold text-black shadow-lg"><span id="l-eq-t">EQ</span></button>
  </div>
  <!-- Zoom bar (opened from the Toolbox) -->
  <div id="zoom-bar" hidden class="absolute left-1/2 z-[55] flex -translate-x-1/2 items-center gap-2 rounded-full bg-black/80 px-3 py-2 ring-1 ring-white/30 bottom-[calc(env(safe-area-inset-bottom)+130px)]">
    <button id="z-out" aria-label="Zoom moins" class="h-10 w-10 rounded-full bg-white/15 text-xl font-bold">−</button>
    <span id="z-v" class="w-12 text-center text-sm font-bold">100%</span>
    <button id="z-in" aria-label="Zoom plus" class="h-10 w-10 rounded-full bg-white/15 text-xl font-bold">+</button>
    <button id="z-reset" class="h-10 rounded-full bg-amber-400 px-3 text-sm font-extrabold text-black">Reset</button>
    <button id="z-x" aria-label="Fermer le zoom" class="h-10 w-10 rounded-full bg-white/15">✕</button>
  </div>

  <nav class="absolute inset-x-0 bottom-0 z-40 flex h-[calc(64px+env(safe-area-inset-bottom))] items-start border-t border-white/10 bg-black/70 pb-[env(safe-area-inset-bottom)] backdrop-blur">
    <button class="tab active flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="home"><i data-lucide="house" class="h-6 w-6"></i>Accueil</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="search"><i data-lucide="search" class="h-6 w-6"></i>Recherche</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="clips"><i data-lucide="clapperboard" class="h-6 w-6"></i>Clips</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="messages"><span class="relative"><i data-lucide="mail" class="h-6 w-6"></i><span id="msg-badge" hidden class="absolute -right-2 -top-1 min-w-[16px] rounded-full bg-red-500 px-1 text-center text-[10px] font-extrabold leading-4 text-white">0</span></span>Messages</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="profile"><i data-lucide="user-round" class="h-6 w-6"></i>Profil</button>
  </nav>

  <!-- Pages: Recherche, Clips, Messages, Profil -->
  <main id="page" hidden class="absolute inset-x-0 bottom-[calc(64px+env(safe-area-inset-bottom))] top-[calc(env(safe-area-inset-top)+116px)] overflow-y-auto bg-neutral-950 p-4" style="z-index:45"></main>

  <!-- Modal layer (comments, citizen card, message, Ask AI, menu, share toast) -->
  <div id="back" hidden class="absolute inset-0 z-[66] bg-black/60"></div>
  <div id="modal" hidden class="absolute inset-x-0 bottom-0 z-[70] max-h-[85%] overflow-y-auto rounded-t-3xl bg-neutral-900 p-4 pb-[calc(env(safe-area-inset-bottom)+16px)] shadow-2xl"></div>
  <div id="toast" hidden class="absolute inset-x-4 bottom-[calc(env(safe-area-inset-bottom)+130px)] z-[80] rounded-xl bg-gold px-4 py-2.5 text-center text-sm font-bold text-black"></div>

  <!-- Importer (upload studio, handled by upload.js) -->
  <div class="up-sheet" id="up-sheet" hidden>
    <div class="up-head"><button id="up-back" aria-label="Retour">‹ Retour</button><span id="up-title">Nouveau clip</span><button id="up-close" aria-label="Fermer">✕</button></div>
    <div class="st-step" id="st-1">
      <label class="up-pick" id="up-pick">Choisir un fichier vidéo<input type="file" id="up-file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden></label>
      <button type="button" id="up-gal" class="up-pick" style="width:100%;margin-top:10px;background:#262626;color:#fff;border:1px solid #404040">Ma galerie (dans l’appli)</button>
    </div>
    <div class="st-step" id="st-2" hidden>
      <video id="st-prev" class="st-prev" playsinline controls loop></video>
      <div class="st-lbl">Couper (Trim)</div>
      <div class="st-tool"><label>Début <b id="st-t0v">0.0</b> s<input id="st-t0" type="range" min="0" max="1" step="0.1" value="0"></label>
        <label>Fin <b id="st-t1v">0.0</b> s<input id="st-t1" type="range" min="0" max="1" step="0.1" value="1"></label></div>
      <div class="st-lbl">Couverture (Cover)</div>
      <div class="st-tool"><label>Image à <b id="st-cvv">0.0</b> s<input id="st-cv" type="range" min="0" max="1" step="0.1" value="0"></label></div>
      <div class="st-lbl">Filtres</div>
      <div class="st-filters" id="st-filters">
        <button data-f="" class="on">Normal</button><button data-f="vif">Vif</button><button data-f="chaud">Chaud</button><button data-f="froid">Froid</button><button data-f="nb">N&amp;B</button><button data-f="vintage">Vintage</button>
      </div>
      <div class="st-lbl">Titre (obligatoire)</div>
      <input id="st-title" maxlength="120" placeholder="Titre du clip" autocomplete="off">
      <div class="st-lbl">Description</div>
      <textarea id="st-desc" placeholder="Description…"></textarea>
      <div class="st-lbl">Commentaire</div>
      <textarea id="st-comment" placeholder="Commentaire…"></textarea>
      <div class="st-lbl">Musique</div>
      <div class="st-music">
        <button id="st-music-btn">♫ Choisir une musique</button>
        <button id="st-music-del" hidden title="Supprimer la musique">🗑</button>
      </div>
      <div class="mu-panel" id="mu-panel" hidden>
        <input id="mu-q" type="search" placeholder="Rechercher une musique…">
        <div class="mu-list" id="mu-list"></div>
      </div>
      <div class="ai">
        <div class="ai-title">✨ Assistant IA</div>
        <div class="ai-reply" id="ai-reply">Analyse de la vidéo…</div>
        <div class="ai-list" id="ai-list"></div>
        <div class="ai-chips">
          <button data-q="Propose-moi une description">Description</button>
          <button data-q="Propose-moi un commentaire">Commentaire</button>
          <button data-q="Améliore l'image">Améliorer l'image</button>
          <button data-q="Quelle musique conviendrait ?">Musique</button>
          <button data-q="Transforme la vidéo en cartoon">Cartoon</button>
          <button data-q="Incarne un personnage">Personnage</button>
        </div>
        <div class="ai-ask"><input id="ai-q" placeholder="Demandez à l'IA…"><button id="ai-mic" title="Dictée vocale">🎤</button><button id="ai-send" title="Envoyer">➤</button></div>
      </div>
      <div class="st-lbl">Visibilité</div>
      <select id="st-priv" aria-label="Visibilité" style="width:100%;padding:12px;border-radius:12px;background:#262626;color:#fff;border:1px solid #404040;font-size:15px">
        <option value="public">Public</option><option value="followers">Abonnés uniquement</option><option value="private">Privé (moi seulement)</option>
      </select>
      <button class="st-pub" id="st-pub">Publier</button>
    </div>
    <div class="up-track"><div id="up-bar"></div></div>
    <div id="up-label"></div>
    <div id="up-result"></div>
  </div>
</div>

<!-- Mode PC: fixed 800x450 window (outside the phone column) -->
<div id="pc-back" hidden class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/70">
  <div id="pc-win" class="relative overflow-hidden rounded-xl bg-black shadow-2xl ring-1 ring-white/30" style="width:min(800px,calc(100vw - 16px));height:min(450px,calc((100vw - 16px) * 9 / 16 + 44px));max-height:calc(100vh - 16px)">
    <div class="flex h-11 items-center justify-between bg-neutral-900 px-3 text-sm font-bold"><span id="pc-t" class="truncate"></span><button id="pc-x" aria-label="Fermer" class="flex h-9 w-9 items-center justify-center rounded-full bg-neutral-800">✕</button></div>
    <video id="pc-v" controls playsinline loop class="block w-full bg-black" style="height:calc(100% - 44px)"></video>
  </div>
</div>
<script defer src="/app.js?v={{BUILD_ID}}"></script>
<script type="module" src="/upload.js?v={{BUILD_ID}}"></script>
</body>
</html>
