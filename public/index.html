<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;overflow:hidden}
  .phone{width:390px;max-width:100vw;height:100dvh;height:844px;max-height:100dvh;margin:0 auto;position:relative;background:#000;overflow:hidden}
  body{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:#111}
  .phone{width:390px;height:min(844px,100dvh);border-radius:24px;box-shadow:0 0 60px rgba(0,0,0,.8)}

  .video-wrap{position:absolute;inset:0;width:100%;height:100%;background:#111}

  .video-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .gradient-top{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);pointer-events:none;z-index:2}
  .gradient-bottom{position:absolute;bottom:0;left:0;right:0;height:260px;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 45%,transparent 100%);pointer-events:none;z-index:2}
  .topbar{position:absolute;top:0;left:0;right:0;height:56px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .top-left{display:flex;align-items:center;gap:10px}
  .btn-circle{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .top-title{font-size:17px;font-weight:800;letter-spacing:-.2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .top-right{display:flex;align-items:center;gap:8px}

  .retour{position:absolute;top:64px;left:12px;z-index:10;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.15)}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .play svg{margin-left:3px}
  .rail{position:absolute;right:12px;bottom:212px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:10}
  .rail-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#fff;cursor:pointer}
  .rail-icon{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
  .rail-icon svg{width:28px;height:28px}
  .rail-label{font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .rail-count{font-size:13px;font-weight:700;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .info{position:absolute;left:12px;right:72px;bottom:132px;z-index:10}
  .user-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .avatar{width:36px;height:36px;border-radius:50%;background:#FFD700;color:#000;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #fff}
  .user-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .follow{font-size:12px;font-weight:700;border:1px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .desc{font-size:13.5px;line-height:1.35;max-height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .music{margin-top:7px;font-size:12.5px;opacity:.92;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .player-bar{position:absolute;left:12px;right:12px;bottom:104px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .time{font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .fullscreen{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .citizen-bar{position:absolute;left:8px;right:8px;bottom:62px;height:40px;background:#FFFBF0;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;z-index:11;box-shadow:0 4px 20px rgba(0,0,0,.35);overflow:hidden}
  .citizen-bar .mini{width:26px;height:26px;border-radius:50%;background:#FFF3C4;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;flex-shrink:0}
  .citizen-bar .name{font-size:12.5px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
  .pill{border:none;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
  .pill-beige{background:#F3E6B8;color:#111}
  .pill-dark{background:#111;color:#fff}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#000;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-around;align-items:center;z-index:12;padding-bottom:env(safe-area-inset-bottom)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#8A8A8A;font-size:10.5px;font-weight:600;cursor:pointer;min-width:62px}
  .tab.active{color:#fff}
  .tab svg{width:24px;height:24px}
  .badge{position:absolute;margin-top:-26px;margin-left:18px;background:#FF3B30;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 5px;line-height:1}
  .tab-wrap{position:relative}

/* ===== FIX: topbar fixed + touch targets + Agon nav ===== */
.phone{width:min(390px,100%);overflow:hidden}

.topbar{position:fixed;top:0;left:max(0px,calc(50vw - 195px));width:min(100%,390px);height:auto;min-height:56px;padding:max(12px,env(safe-area-inset-top)) 12px 8px;z-index:50}
.btn-circle,.top-right .btn-circle{width:48px;height:48px;min-width:48px;min-height:48px;font-size:22px}
.retour{top:calc(max(12px,env(safe-area-inset-top)) + 64px);min-height:44px;display:flex;align-items:center;padding:0 16px}
.play{width:80px;height:80px}
.rail{right:16px;gap:16px;align-items:center;bottom:340px}
.rail-item{min-width:56px;gap:2px}
.rail-icon{width:56px;height:56px;min-width:56px;min-height:56px}
.rail-icon svg{width:30px;height:30px}
.rail-label{display:none}
.rail-item>span[style]{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.35)}
.info{bottom:226px;right:88px}
.follow{min-height:44px;padding:0 14px}
.nav-agon{position:absolute;left:12px;right:12px;bottom:170px;height:48px;display:flex;gap:8px;z-index:20}
.nav-agon button{flex:1;min-height:48px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 6px}

.player-bar{bottom:118px}
.fullscreen{min-height:44px;padding:0 14px}
.citizen-bar{height:48px;padding:0 8px;bottom:62px}
.citizen-bar .name{max-width:64px}
.pill{min-height:44px;padding:0 10px}
.tabbar{min-height:56px;height:auto}
.tab{min-height:56px;min-width:64px;justify-content:center}
@media(max-height:820px){.rail-count{display:none}}

/* ===== Import / compress sheet ===== */
.up-open{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 116px);z-index:10;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.48);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.up-sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#111;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.up-sheet[hidden]{display:none}
.up-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.up-head button{width:44px;height:44px;border-radius:50%;border:none;background:#222;color:#fff;font-size:20px}
.up-modes{display:flex;gap:8px}
.up-modes button{flex:1;min-height:52px;border-radius:14px;border:2px solid #333;background:#1a1a1a;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.up-modes button.on{border-color:#FFD700;background:#2a2410}
.up-pick{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:#FFD700;color:#000;font-weight:800;font-size:14px;cursor:pointer}
.up-pick.dis{opacity:.4;pointer-events:none}
.up-track{height:10px;border-radius:999px;background:#333;overflow:hidden}
#up-bar{height:100%;width:0;background:#FFD700;transition:width .2s}
#up-label{font-size:13px;min-height:18px}
#up-result{font-size:13.5px;font-weight:700;display:flex;flex-direction:column;gap:8px}
.up-dl{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;border:1px solid #fff;color:#fff;text-decoration:none;font-size:13px}
.brand-footer{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#8A8A8A;z-index:11;padding:2px 8px;background:rgba(0,0,0,.6)}
.brand-footer a{color:#bbb;text-decoration:none}

/* ===== Studio: fichier -> description + AI -> publier ===== */
.up-sheet{max-height:92%;overflow-y:auto}
.st-step[hidden],.mu-panel[hidden]{display:none}
.st-step{display:flex;flex-direction:column;gap:12px}
.st-prev{width:100%;height:150px;object-fit:contain;background:#000;border-radius:14px}
.st-lbl{font-size:12px;font-weight:700;color:#aaa}
#st-desc{width:100%;min-height:72px;border-radius:14px;border:1px solid #333;background:#1a1a1a;color:#fff;padding:10px;font-size:14px;font-family:inherit;resize:vertical}
.st-music{display:flex;gap:8px}
.st-music button{min-height:48px;border-radius:14px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
#st-music-btn{flex:1;text-align:left;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st-music-del{width:48px}
.ai{border:1px solid #FFD700;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#17140a}
.ai-title{font-weight:800;font-size:14px;color:#FFD700}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap}
.ai-chips button{min-height:36px;border-radius:999px;border:1px solid #444;background:#222;color:#fff;font-size:12px;font-weight:700;padding:0 12px;cursor:pointer}
.ai-ask{display:flex;gap:6px}
.ai-ask input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1px solid #333;background:#111;color:#fff;padding:0 14px;font-size:13px}
.ai-ask button{width:44px;height:44px;border-radius:50%;border:none;background:#FFD700;color:#000;font-size:18px;cursor:pointer}
.ai-ask button.rec{background:#FF3B30;color:#fff}
.ai-reply{font-size:13px;min-height:18px}
.ai-list{display:flex;flex-direction:column;gap:6px}
.ai-item,.mu-item{display:flex;align-items:center;gap:8px;background:#1d1d1d;border-radius:12px;padding:8px}
.ai-item .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.ai-item .tx b{display:block;font-size:12px;color:#FFD700}
.use{min-height:40px;border:none;border-radius:999px;background:#FFD700;color:#000;font-weight:800;font-size:12px;padding:0 12px;cursor:pointer;white-space:nowrap}
.use.done{background:#2a8a3a;color:#fff}
.mu-panel{display:flex;flex-direction:column;gap:8px}
.mu-panel input{min-height:44px;border-radius:999px;border:1px solid #333;background:#1a1a1a;color:#fff;padding:0 14px;font-size:14px}
.mu-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.mu-item img{width:48px;height:48px;border-radius:10px}
.mu-item .tx{flex:1;min-width:0;font-size:13px;font-weight:700}
.mu-item .tx small{display:block;color:#aaa;font-weight:500}
.mu-play{width:40px;height:40px;border-radius:50%;border:1px solid #fff;background:none;color:#fff;font-size:14px;cursor:pointer}
.st-pub{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;border:none;background:#FFD700;color:#000;font-weight:800;font-size:15px;cursor:pointer}
.st-pub:disabled{opacity:.4}

/* ===== Partager / Carnet d'Amis / Contact ===== */
.sh-sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:#111;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}
.sh-sheet[hidden]{display:none}
.sh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sh-grid button{min-height:64px;border-radius:14px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:12px;font-weight:700;cursor:pointer;padding:4px}
.sh-grid button:active{background:#FFD700;color:#000}
.sh-sub{font-size:12px;color:#aaa;line-height:1.4;word-break:break-word}
.sh-toast{position:absolute;left:16px;right:16px;bottom:100px;z-index:90;background:#FFD700;color:#000;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;text-align:center}
.sh-toast[hidden]{display:none}
.fr-chips{display:flex;gap:6px;overflow-x:auto}
.fr-chips button{flex:none;min-height:36px;border-radius:999px;border:1px solid #444;background:#222;color:#fff;font-size:12px;font-weight:700;padding:0 12px}
.fr-chips button.on{background:#FFD700;color:#000;border-color:#FFD700}
.fr-card{background:#1d1d1d;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fr-top{display:flex;align-items:center;gap:10px}
.fr-top .avatar{width:40px;height:40px}
.fr-top small{display:block;color:#aaa}
.fr-act{display:flex;gap:6px;flex-wrap:wrap}
.fr-act button{min-height:40px;border-radius:999px;border:none;background:#F3E6B8;color:#111;font-weight:700;font-size:12px;padding:0 12px;cursor:pointer}

/* ===== Plein ecran style Bobines: video edge to edge, no frame ===== */
html,body{width:100%;height:100%;margin:0;background:#000;display:block;overflow:hidden;overscroll-behavior:none}
body{min-height:0}
.phone{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;box-shadow:none;background:#000;touch-action:pan-x}
.video-wrap,.video-wrap video,.video-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.topbar{position:absolute;left:0;right:0;width:100%;background:transparent}
.tabbar{background:transparent;border-top:none;min-height:calc(56px + env(safe-area-inset-bottom));z-index:12;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.tab{color:rgba(255,255,255,.7)}.tab.active{color:#fff}
.nav-agon,.player-bar,.brand-footer,.retour{display:none}
.citizen-bar{bottom:calc(60px + env(safe-area-inset-bottom))}
.info{bottom:calc(120px + env(safe-area-inset-bottom))}
.rail{bottom:calc(120px + env(safe-area-inset-bottom))}
.sh-toast{bottom:calc(120px + env(safe-area-inset-bottom))}
/* Header + rail sizes (Reels) */
.topbar{align-items:center;gap:8px}
.top-left{gap:10px;align-items:center}
.btn-circle,.top-right .btn-circle{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;background:transparent;backdrop-filter:none;display:flex;align-items:center;justify-content:center}
.btn-circle svg,.top-right .btn-circle svg{width:28px;height:28px;display:block}
.top-title{font-size:28px;font-weight:700;line-height:44px;height:44px;display:flex;align-items:center;letter-spacing:0;white-space:nowrap}
.top-right{gap:4px}
.rail{gap:22px}
.rail-item>span[style]{background:transparent!important;width:40px;height:24px;font-size:20px!important}
.rail-item{gap:4px;min-width:56px}
.rail-icon{width:40px;height:40px;min-width:40px;min-height:40px;background:transparent;backdrop-filter:none}
.rail-icon svg{width:32px;height:32px}
.rail-count{display:block!important;font-size:14px;font-weight:600;color:#fff;line-height:1}
.video-wrap.slide-up{animation:slu .28s ease-out}.video-wrap.slide-down{animation:sld .28s ease-out}
@keyframes slu{from{transform:translateY(100%)}to{transform:none}}
@keyframes sld{from{transform:translateY(-100%)}to{transform:none}}
/* ===== SPEC: header 64px, rail, tabbar 72px, fullscreen video ===== */
.topbar{position:absolute;top:0;left:0;right:0;width:100%;height:64px;min-height:64px;padding:0 16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:0;z-index:50}
.top-left{display:flex;flex-direction:row;align-items:center;gap:12px;flex:none}
.top-right{display:flex;flex-direction:row;align-items:center;gap:18px;flex:none}
.topbar .btn-circle,.topbar .top-right .btn-circle{width:48px;height:48px;min-width:48px;min-height:48px;padding:0;background:transparent;backdrop-filter:none;display:flex;align-items:center;justify-content:center;flex:none}
.topbar .btn-circle svg,.topbar .top-right .btn-circle svg{width:45px;height:45px}
.topbar .top-title{font-size:50px;font-weight:700;line-height:64px;height:64px;letter-spacing:0;white-space:nowrap;display:flex;align-items:center}
.rail{right:0;padding-right:16px;gap:24px;align-items:center;bottom:calc(72px + 120px + env(safe-area-inset-bottom))}
.rail-item{gap:4px;min-width:48px}
.rail-icon,.rail-item>span[style]{width:48px!important;height:48px!important;min-width:48px;min-height:48px;background:transparent!important}
.rail-icon svg{width:48px;height:48px}
.rail-item>span[style]{font-size:32px!important}
.rail-count{display:block!important;font-size:24px;font-weight:700;color:#fff;line-height:1}
.tabbar{height:calc(72px + env(safe-area-inset-bottom));min-height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);align-items:center}
.tab{min-height:72px;min-width:0;flex:1;font-size:12px;gap:4px;text-align:center;line-height:1.1}
.tab svg{width:32px;height:32px}
.citizen-bar{bottom:calc(72px + 8px + env(safe-area-inset-bottom))}
.info{bottom:calc(72px + 64px + env(safe-area-inset-bottom));right:calc(16px + 48px + 24px)}
.sh-toast{bottom:calc(72px + 24px + env(safe-area-inset-bottom))}
.up-open{top:80px}
html,body{width:100vw;height:100dvh}
.phone,.video-wrap,.video-wrap video,.video-wrap img{width:100vw;height:100dvh}
.video-wrap,.video-wrap video,.video-wrap img{object-fit:cover}
/* ===== SPEC (Reels reference): header 52 | Retour/Devant 40px at 8/8 | top buttons 28px at top 76 | rail right 12 bottom 160, item 62 | tabbar 64 ===== */
:root{--hdr:52px;--btn-top:calc(env(safe-area-inset-top,0px) + 76px)}
.topbar{height:calc(var(--hdr) + env(safe-area-inset-top,0px));min-height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;box-sizing:border-box;pointer-events:none;z-index:50}
.topbar>*{pointer-events:none}
.top-left{gap:0}
.topbar .top-title{margin-left:96px;font-size:clamp(24px,calc((100vw - 128px) / 5.7),40px);line-height:var(--hdr);height:var(--hdr);pointer-events:auto}
.topbar .top-left .btn-circle{position:absolute;left:16px;top:var(--btn-top);pointer-events:auto}
.topbar .top-right{position:absolute;right:16px;top:var(--btn-top);gap:24px;pointer-events:auto}
.topbar .btn-circle,.topbar .top-right .btn-circle{width:28px;height:28px;min-width:28px;min-height:28px;position:relative}
.topbar .top-left .btn-circle{position:absolute}
.topbar .btn-circle::after{content:"";position:absolute;inset:-8px}
.topbar .btn-circle svg,.topbar .top-right .btn-circle svg{width:28px;height:28px}
.hist{position:absolute;z-index:60;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;display:flex;gap:8px}
.hist-btn{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hist-btn svg{width:24px;height:24px;display:block}
.up-open{top:calc(var(--btn-top) + 28px + 8px);left:12px}
.rail{right:12px;padding-right:0;gap:18px;bottom:calc(160px + env(safe-area-inset-bottom))}
.rail-item{width:48px;height:62px;min-width:48px;gap:2px;justify-content:center;position:relative}
.rail-item::after{content:"";position:absolute;inset:0 -6px}
.rail-icon,.rail-item>span[style]{width:30px!important;height:30px!important;min-width:30px;min-height:30px}
.rail-icon svg{width:30px;height:30px}
.rail-item>span[style]{font-size:20px!important;line-height:30px}
.rail-count{font-size:16px;line-height:16px;font-weight:700}
.tabbar{height:calc(64px + env(safe-area-inset-bottom));min-height:calc(64px + env(safe-area-inset-bottom))}
.tab{min-height:64px}
.tab svg{width:28px;height:28px}
.citizen-bar{bottom:calc(64px + 8px + env(safe-area-inset-bottom))}
.info{bottom:calc(64px + 64px + env(safe-area-inset-bottom));right:calc(12px + 48px + 12px)}
.sh-toast{bottom:calc(64px + 24px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="phone">
  <div class="video-wrap">

  </div>
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  <div class="topbar">
    <div class="top-left">
      <button class="btn-circle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

    </div>

      <button class="btn-circle" id="open-search" aria-label="Recherche"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="btn-circle" aria-label="Plus"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </div>
  <div class="hist">
    <button class="hist-btn" id="hist-back" aria-label="Retour" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="hist-btn" id="hist-forward" aria-label="Devant" onclick="history.forward()"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

  <button class="play" onclick="document.getElementById('vid').play();document.querySelector('.video-wrap img').style.display='none';this.style.display='none'">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="rail">
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C1 8 3 4.5 6.5 4.5c2 0 3.5 1 4.5 2.5 1-1.5 2.5-2.5 4.5-2.5C19 4.5 21 8 19.5 12c-2.5 4.5-7.5 9-7.5 9z"/></svg></span><span class="rail-label">Like</span><span class="rail-count">3</span></button>
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 12a8 8 0 0 1-11 7.5L3 21l1.5-4A8 8 0 1 1 21 12z"/></svg></span><span class="rail-label">Comment</span><span class="rail-count">0</span></button>
    <button class="rail-item" id="rail-share" aria-label="Partager"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 4l7 7-7 7M21 11H9a6 6 0 0 0-6 6v2"/></svg></span><span class="rail-label">Partager</span><span class="rail-count">1</span></button>
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span><span class="rail-label">Save</span><span class="rail-count">0</span></button>
    <button class="rail-item"><span style="font-size:22px">•••</span></button>
  </div>
  <div class="info">
    <div class="user-row">
      <div class="avatar">EL</div>
      <div class="user-name">El Qaisy Abdelmalik</div>
      <button class="follow">Suivre</button>
    </div>
    <div class="desc">VID_20260831_211340 petit poussin 🐥</div>
    <div class="music">♫ Musique originale - El Qaisy Abdelmalik</div>
  </div>
  <button class="up-open" id="up-open">⬆ Importer</button>
  <div class="up-sheet" id="up-sheet" hidden>
    <div class="up-head"><span id="up-title">Nouveau clip</span><button id="up-close">✕</button></div>
    <div class="st-step" id="st-1">
      <div class="up-modes">
        <button data-mode="powder">بودرة ⚡<br><small>480p · 500 kbps</small></button>
        <button data-mode="normal" class="on">جودة عادية<br><small>720p · 1 Mbps</small></button>
      </div>
      <label class="up-pick" id="up-pick">Choisir un fichier vidéo<input type="file" id="up-file" accept="video/*" hidden></label>
    </div>
    <div class="st-step" id="st-2" hidden>
      <video id="st-prev" class="st-prev" playsinline controls loop></video>
      <div class="st-lbl">Description</div>
      <textarea id="st-desc" placeholder="Description…"></textarea>
      <div class="st-lbl">Musique</div>

        <button id="st-music-btn">♫ Choisir une musique</button>
        <button id="st-music-del" hidden title="Supprimer la musique">🗑</button>
      </div>
      <div class="mu-panel" id="mu-panel" hidden>
        <input id="mu-q" type="search" placeholder="Rechercher une musique…">
        <div class="mu-list" id="mu-list"></div>
      </div>
      <div class="ai">
        <div class="ai-title">✨ AI</div>
        <div class="ai-reply" id="ai-reply">كنشوف الفيديو…</div>
        <div class="ai-list" id="ai-list"></div>

          <button data-q="عطيني وصف">وصف</button>

          <button data-q="شنو الموسيقى المناسبة؟">الموسيقى</button>
          <button data-q="حول الفيديو لكارطون">كارطون</button>
          <button data-q="تقمص شخصية">شخصية</button>
        </div>
        <div class="ai-ask"><input id="ai-q" placeholder="سول AI…"><button id="ai-mic" title="صوت">🎤</button><button id="ai-send">➤</button></div>
      </div>
      <button class="st-pub" id="st-pub">Publier</button>

    <div class="up-track"><div id="up-bar"></div></div>

    <span class="time">0:00 / 1:07</span>
    <button class="fullscreen">⛶ Plein écran</button>
    <span style="display:flex;gap:14px;font-size:16px">🔊 ⋮</span>

  <div class="citizen-bar">
    <div class="mini">EL</div>
    <div class="name">@El Qaisy Abdelmalik</div>
    <button class="pill pill-beige" id="open-carnet">Citizen card</button>
    <button class="pill pill-beige">Message</button>
    <button class="pill pill-dark">Ask AI</button>
  </div>
  <div class="tabbar">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10H3z"/></svg>Accueil</button>

    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Recherche</button>
    <button class="tab"><div class="tab-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 7l9 6 9-6"/></svg><span class="badge">14</span></div>Boîte de réception</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>Profil</button>
  </div>
</div>
<script>
(function(){
  var v=document.getElementById('vid'),img=document.querySelector('.video-wrap img'),pl=document.querySelector('.play');
  function start(){img.style.display='none';pl.style.display='none';return v.play();}
  document.getElementById('pause').onclick=function(){
    if(v.paused){start();this.textContent='Pause';}else{v.pause();this.textContent='Lecture';}
  };
  var redo=document.getElementById('redo');
  redo.onclick=function(){
    var n=3;v.loop=false;v.currentTime=0;start();redo.textContent='Redo '+n+'x';
    v.onended=function(){n--;if(n>0){redo.textContent='Redo '+n+'x';v.currentTime=0;v.play();}else{v.onended=null;v.loop=true;redo.textContent='Redo 3x';}};
  };
})();
</script>
<script>
(function(){
  var v=document.getElementById('vid'),img=document.querySelector('.video-wrap img'),pl=document.querySelector('.play'),wrap=document.querySelector('.video-wrap');
  var clips=[{url:v.src,desc:document.querySelector('.desc').textContent,name:document.querySelector('.user-name').textContent}],i=0;
  fetch('/api/clips').then(function(r){return r.ok?r.json():null}).then(function(d){
    if(d&&d.clips&&d.clips.length){clips=d.clips.map(function(c){var m=c.meta||{};return{url:c.url,desc:m.description||'',name:m.author||m.name||document.querySelector('.user-name').textContent};});i=0;show(0);}
  }).catch(function(){});
  function show(dir){
    var c=clips[i];v.src=c.url;v.load();img.style.display='none';pl.style.display='none';
    document.querySelector('.desc').textContent=c.desc||'';
    var p=v.play();if(p&&p.catch)p.catch(function(){pl.style.display='';});
    if(dir){wrap.classList.remove('slide-up','slide-down');void wrap.offsetWidth;wrap.classList.add(dir>0?'slide-up':'slide-down');}
  }
  function go(d){var n=i+d;if(n<0||n>=clips.length){return;}i=n;show(d);}
  var y0=null,x0=0,ph=document.querySelector('.phone');
  ph.addEventListener('touchstart',function(e){if(e.target.closest('button,a,input,textarea,.up-sheet,.sh-sheet'))return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;},{passive:true});
  ph.addEventListener('touchend',function(e){if(y0===null)return;var dy=e.changedTouches[0].clientY-y0,dx=e.changedTouches[0].clientX-x0;y0=null;if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5)go(dy<0?1:-1);});
  var lock=0;ph.addEventListener('wheel',function(e){if(e.target.closest('.up-sheet,.sh-sheet'))return;var t=Date.now();if(t-lock<600||Math.abs(e.deltaY)<20)return;lock=t;go(e.deltaY>0?1:-1);},{passive:true});
  document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowDown')go(1);if(e.key==='ArrowUp')go(-1);});
  document.getElementById('next').onclick=function(){go(1)};
  document.getElementById('prev').onclick=function(){go(-1)};
  v.addEventListener('click',function(){v.paused?v.play():v.pause();});
})();
</script>
<script type="module" src="/upload.js"></script>
<script type="module" src="/share.js"></script>
</body>
