<script>
/* "Desktop site" mode on phones lays the page out ~980px wide, so every control looks tiny. Rebuild a phone-width layout and scale it up. */
(function(){var sw=screen.width;if(window.matchMedia&&matchMedia('(pointer:coarse)').matches&&sw<=600&&innerWidth>sw*1.3){var s=innerWidth/sw,h=document.documentElement;h.classList.add('fx-desk');h.style.setProperty('--fxw',sw+'px');h.style.setProperty('--fxh',(innerHeight/s)+'px');h.style.setProperty('--fxs',s);}})();
</script>

/* ===== Partager / Carnet d'Amis / Contact ===== */
.sh-sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:#111;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}

/* ===== Plein ecran style Bobines: video edge to edge, no frame ===== */

body{min-height:0}
.phone{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;box-shadow:none;background:#000;touch-action:pan-x}

.topbar>*{pointer-events:none}

.topbar .top-left .btn-circle{position:absolute;left:16px;top:var(--btn-top);pointer-events:auto}
.topbar .top-right{position:absolute;right:16px;top:var(--btn-top);gap:24px;pointer-events:auto}
.topbar .btn-circle,.topbar .top-right .btn-circle{width:28px;height:28px;min-width:28px;min-height:28px;position:relative}
.topbar .top-left .btn-circle{position:absolute}
.topbar .btn-circle::after{content:"";position:absolute;inset:-8px}
.topbar .btn-circle svg,.topbar .top-right .btn-circle svg{width:28px;height:28px}

.up-open{top:calc(var(--btn-top) + 28px + 8px);left:12px}
.rail{right:12px;padding-right:0;gap:18px;bottom:calc(160px + env(safe-area-inset-bottom))}
.rail-item{width:48px;height:62px;min-width:48px;gap:2px;justify-content:center;position:relative}
.rail-item::after{content:"";position:absolute;inset:0 -6px}
.rail-icon,.rail-item>span[style]{width:30px!important;height:30px!important;min-width:30px;min-height:30px}
.rail-icon svg{width:30px;height:30px}
.rail-item>span[style]{font-size:20px!important;line-height:30px}
.rail-count{font-size:16px;line-height:16px;font-weight:700}
.tabbar{height:calc(64px + env(safe-area-inset-bottom));min-height:calc(64px + env(safe-area-inset-bottom))}

.topbar .top-right{right:38px}

.search-field svg{width:20px;height:20px;flex:none}
.search-field span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hist .hist-btn{pointer-events:auto}

.search-field{left:72px;right:72px}

@media(max-height:660px){.rail{bottom:calc(120px + env(safe-area-inset-bottom));transform:scale(.85);transform-origin:right bottom}}
@media(max-height:560px){.rail{transform:scale(.65)}}
@media(max-height:480px){.rail{transform:scale(.4)}}

.search-field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px;padding:0;cursor:text;-webkit-appearance:none;appearance:none}

.fx-back{position:absolute;inset:0;z-index:79;background:rgba(0,0,0,.55)}
.fx-back[hidden],.fx-drawer[hidden],.fx-pg[hidden]{display:none}
.fx-drawer{position:absolute;top:0;bottom:0;left:0;width:min(78%,300px);z-index:80;background:#111;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 70px) 12px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:10px 0 40px rgba(0,0,0,.6)}

    if(v.paused){start();this.textContent='Pause';}else{v.pause();this.textContent='Lecture';}
  };
  var redo=document.getElementById('redo');
  redo.onclick=function(){
    var n=3;v.loop=false;v.currentTime=0;start();redo.textContent='Redo '+n+'x';
    v.onended=function(){n--;if(n>0){redo.textContent='Redo '+n+'x';v.currentTime=0;v.play();}else{v.onended=null;v.loop=true;redo.textContent='Redo 3x';}};
  };
})();

<script>
(function(){
  var v=document.getElementById('vid'),img=document.querySelector('.video-wrap img'),pl=document.querySelector('.play'),wrap=document.querySelector('.video-wrap');
  var clips=[{url:v.src,desc:document.querySelector('.desc').textContent,name:document.querySelector('.user-name').textContent}],i=0;
  fetch('/api/clips').then(function(r){return r.ok?r.json():null}).then(function(d){
    if(d&&d.clips&&d.clips.length){clips=d.clips.map(function(c){var m=c.meta||{};return{url:c.url,desc:m.description||'',name:m.author||m.name||document.querySelector('.user-name').textContent};});i=0;show(0);}
  }).catch(function(){});
  function show(dir){
    var c=clips[i];v.src=c.url;v.load();img.style.display='none';pl.style.display='none';
    document.querySelector('.desc').textContent=c.desc||'';
    var p=v.play();if(p&&p.catch)p.catch(function(){pl.style.display='';});
    if(dir){wrap.classList.remove('slide-up','slide-down');void wrap.offsetWidth;wrap.classList.add(dir>0?'slide-up':'slide-down');}
  }
  window.__arena={clips:function(){return clips},cur:function(){return i},play:function(n){if(n>=0&&n<clips.length){i=n;show(0);}}};
  function go(d){var n=i+d;if(n<0||n>=clips.length){return;}i=n;show(d);}
  var y0=null,x0=0,ph=document.querySelector('.phone');
  ph.addEventListener('touchstart',function(e){if(e.target.closest('button,a,input,textarea,.up-sheet,.sh-sheet'))return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;},{passive:true});
  ph.addEventListener('touchend',function(e){if(y0===null)return;var dy=e.changedTouches[0].clientY-y0,dx=e.changedTouches[0].clientX-x0;y0=null;if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5)go(dy<0?1:-1);});
  var lock=0;ph.addEventListener('wheel',function(e){if(e.target.closest('.up-sheet,.sh-sheet'))return;var t=Date.now();if(t-lock<600||Math.abs(e.deltaY)<20)return;lock=t;go(e.deltaY>0?1:-1);},{passive:true});
  document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowDown')go(1);if(e.key==='ArrowUp')go(-1);});
  document.getElementById('next').onclick=function(){go(1)};
  document.getElementById('prev').onclick=function(){go(-1)};
  v.addEventListener('click',function(){v.paused?v.play():v.pause();});
})();
</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var back=$('fx-back'),drawer=$('fx-drawer'),pg=$('fx-pg'),sheet=$('fx-sheet');
  var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function toast(m){var t=$('sh-toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400);}
  function A(){return window.__arena||{clips:function(){return[]},cur:function(){return 0},play:function(){}};}
  function key(){var c=A().clips()[A().cur()];return c?(c.url||'').split('?')[0]:'demo';}
  function closeAll(){back.hidden=true;drawer.hidden=true;sheet.hidden=true;$('sh-sheet').hidden=true;}
  function closePg(){pg.hidden=true;}
  function setTab(n){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===n)});}
  back.onclick=closeAll;
  function openSheet(h){sheet.innerHTML=h;sheet.hidden=false;back.hidden=false;var x=sheet.querySelector('[data-x]');if(x)x.onclick=closeAll;}
  /* like / save */
  var store=JSON.parse(localStorage.getItem('fx')||'{}');function save(){localStorage.setItem('fx',JSON.stringify(store));}
  function st(){var k=key();return store[k]||(store[k]={like:0,save:0,cm:[]});}
  var like=$('r-like'),sv=$('r-save'),cmb=$('r-comment');
  var base={like:+like.querySelector('.rail-count').textContent,save:+sv.querySelector('.rail-count').textContent};
  function paint(){var s=st();
    like.classList.toggle('on',!!s.like);like.querySelector('.rail-count').textContent=base.like+(s.like?1:0);
    sv.classList.toggle('on',!!s.save);sv.querySelector('.rail-count').textContent=base.save+(s.save?1:0);
    cmb.querySelector('.rail-count').textContent=s.cm.length;}
  like.onclick=function(){var s=st();s.like=s.like?0:1;save();paint();};
  sv.onclick=function(){var s=st();s.save=s.save?0:1;save();paint();toast(s.save?'تحفظ الفيديو ✓':'تحيد من المحفوظات');};
  var _show=0;setInterval(function(){var k=key();if(_show!==k){_show=k;paint();}},400);
  /* comments */
  function cmHtml(){var s=st();return '<div class="up-head"><span>Commentaires ('+s.cm.length+')</span><button data-x>✕</button></div>'+
    (s.cm.length?s.cm.map(function(c){return '<div class="it" style="background:#1a1a1a;border-radius:12px;padding:10px;font-size:14px">'+esc(c)+'</div>'}).join(''):'<div class="sh-sub">ما كاين حتى تعليق. كون الأول.</div>')+
    '<form class="fx-cm" id="fx-cmf" action="javascript:void(0)"><input id="fx-cmi" placeholder="Ajouter un commentaire…" autocomplete="off"><button>Envoyer</button></form>';}
  function openCm(){openSheet(cmHtml());bindCm();}
  function bindCm(){$('fx-cmf').onsubmit=function(e){e.preventDefault();var v=$('fx-cmi').value.trim();if(!v)return;st().cm.push(v);save();paint();openCm();};}
  cmb.onclick=openCm;
  /* options menu (dots) */
  function openMore(){openSheet('<div class="up-head"><span>Options</span><button data-x>✕</button></div><div class="fx-menu"><button data-a="share">Partager</button><button data-a="copy">Copier le lien</button><button data-a="save">'+(st().save?'Enregistré ✓ (retirer)':'Enregistrer')+'</button><button data-a="report">Signaler</button></div>');
    sheet.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var a=b.dataset.a;
      if(a==='share'){closeAll();$('rail-share').click();}
      else if(a==='copy'){var u=location.origin+location.pathname;var done=function(){toast('تنسخ الرابط ✓')};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){fb(u);done()});else{fb(u);done();}closeAll();}
      else if(a==='save'){closeAll();$('r-save').click();}
      else{closeAll();toast('تسجل الإبلاغ، شكرا');}};});}
  function fb(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();}
  $('b-more').onclick=openMore;$('r-more').onclick=openMore;
  /* drawer */
  $('b-menu').onclick=function(){closeAll();back.hidden=false;drawer.hidden=false;};
  /* pages */
  function page(n){closeAll();
    if(n==='clips'||n==='home'){closePg();setTab(n==='home'?'home':'clips');if(n==='home')A().play(0);return;}
    setTab(n);pg.hidden=false;
    if(n==='search'){pg.innerHTML='<h3>Recherche</h3><div class="sh-sub">Écris dans le champ en haut puis Entrée.</div>';$('q').focus();if($('q').value.trim())runSearch($('q').value);}
    if(n==='inbox'){pg.innerHTML='<h3>Boîte de réception</h3><div class="it">Bienvenue sur {{BRAND_NAME}}<small>Nouveau</small></div><div class="it">El Qaisy Abdelmalik a publié un clip<small>Il y a 1 h</small></div><div class="it">14 notifications non lues<small>Aujourd’hui</small></div>';var b=document.querySelector('.tab .badge');if(b)b.textContent='0';}
    if(n==='profile'){var c=A().clips()[A().cur()]||{};pg.innerHTML='<h3>Profil</h3><div class="it">'+esc(c.name||'El Qaisy Abdelmalik')+'<small>'+A().clips().length+' clip(s)</small></div><div class="it" id="pg-up">⬆ Importer un clip</div>';$('pg-up').onclick=function(){closePg();setTab('clips');$('up-open').click();};}
  }
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){page(t.dataset.tab)}});
  drawer.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var g=b.dataset.go;
    if(g==='upload'){closeAll();$('up-open').click();}else if(g==='share'){closeAll();$('rail-share').click();}else page(g);};});
  /* search */
  function runSearch(q){q=q.trim().toLowerCase();setTab('search');closeAll();pg.hidden=false;
    var cs=A().clips(),r=[];cs.forEach(function(c,i){if(!q||((c.desc||'')+' '+(c.name||'')).toLowerCase().indexOf(q)>-1)r.push(i)});
    pg.innerHTML='<h3>Résultats ('+r.length+')</h3>'+(r.length?r.map(function(i){var c=cs[i];return '<div class="it" data-i="'+i+'">'+esc(c.desc||'Clip '+(i+1))+'<small>'+esc(c.name||'')+'</small></div>'}).join(''):'<div class="sh-sub">Aucun résultat pour « '+esc(q)+' ».</div>');
    pg.querySelectorAll('[data-i]').forEach(function(e){e.onclick=function(){A().play(+e.dataset.i);closePg();setTab('clips');};});}
  $('open-search').onsubmit=function(e){e.preventDefault();runSearch($('q').value);$('q').blur();};
  $('q').addEventListener('keydown',function(e){e.stopPropagation();});
  /* importer: open the file picker directly (sheet still opens via upload.js) */
  $('up-open').addEventListener('click',function(){var f=$('up-file');if(f)f.click();});
  /* follow / citizen buttons */
  var fl=document.querySelector('.follow');fl.onclick=function(){var on=fl.classList.toggle('on');fl.textContent=on?'Abonné':'Suivre';};
  var pills=document.querySelectorAll('.citizen-bar .pill');
  pills[1].onclick=function(){page('inbox');};
  pills[2].onclick=function(){openSheet('<div class="up-head"><span>✨ Ask AI</span><button data-x>✕</button></div><div class="sh-sub">Importe un clip : l’AI propose description, musique et effets à l’étape 2.</div><div class="fx-menu"><button data-u>⬆ Importer un clip</button></div>');sheet.querySelector('[data-u]').onclick=function(){closeAll();$('up-open').click();};};
  document.querySelectorAll('.nav-agon').forEach(function(){});
  var fsb=document.querySelector('.fullscreen');if(fsb)fsb.onclick=function(){var e=document.documentElement;(e.requestFullscreen||function(){}).call(e);};
  paint();
})();
</script>
<script type="module" src="/upload.js"></script>
<script type="module" src="/share.js"></script>
</body>
</html>
