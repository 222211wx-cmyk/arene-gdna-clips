<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND_NAME}}</title>
<meta property="og:title" content="{{BRAND_NAME}}">
<meta property="og:site_name" content="{{BRAND_NAME}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL_URL}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;overflow:hidden}
  .phone{width:390px;max-width:100vw;height:100dvh;height:844px;max-height:100dvh;margin:0 auto;position:relative;background:#000;overflow:hidden}
  body{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:#111}
  .phone{width:390px;height:min(844px,100dvh);border-radius:24px;box-shadow:0 0 60px rgba(0,0,0,.8)}
  @media(max-width:430px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
  .video-wrap{position:absolute;inset:0;width:100%;height:100%;background:#111}
  .video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .video-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .gradient-top{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);pointer-events:none;z-index:2}
  .gradient-bottom{position:absolute;bottom:0;left:0;right:0;height:260px;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 45%,transparent 100%);pointer-events:none;z-index:2}
  .topbar{position:absolute;top:0;left:0;right:0;height:56px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .top-left{display:flex;align-items:center;gap:10px}
  .btn-circle{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .top-title{font-size:17px;font-weight:800;letter-spacing:-.2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .top-right{display:flex;align-items:center;gap:8px}
  .top-right .btn-circle{width:34px;height:34px}
  .retour{position:absolute;top:64px;left:12px;z-index:10;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.15)}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .play svg{margin-left:3px}
  .rail{position:absolute;right:12px;bottom:212px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:10}
  .rail-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#fff;cursor:pointer}
  .rail-icon{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
  .rail-icon svg{width:28px;height:28px}
  .rail-label{font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .rail-count{font-size:13px;font-weight:700;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .info{position:absolute;left:12px;right:72px;bottom:132px;z-index:10}
  .user-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .avatar{width:36px;height:36px;border-radius:50%;background:#FFD700;color:#000;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #fff}
  .user-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .follow{font-size:12px;font-weight:700;border:1px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .desc{font-size:13.5px;line-height:1.35;max-height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .music{margin-top:7px;font-size:12.5px;opacity:.92;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .player-bar{position:absolute;left:12px;right:12px;bottom:104px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .time{font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .fullscreen{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .citizen-bar{position:absolute;left:8px;right:8px;bottom:62px;height:40px;background:#FFFBF0;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;z-index:11;box-shadow:0 4px 20px rgba(0,0,0,.35);overflow:hidden}
  .citizen-bar .mini{width:26px;height:26px;border-radius:50%;background:#FFF3C4;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;flex-shrink:0}
  .citizen-bar .name{font-size:12.5px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
  .pill{border:none;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
  .pill-beige{background:#F3E6B8;color:#111}
  .pill-dark{background:#111;color:#fff}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#000;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-around;align-items:center;z-index:12;padding-bottom:env(safe-area-inset-bottom)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#8A8A8A;font-size:10.5px;font-weight:600;cursor:pointer;min-width:62px}
  .tab.active{color:#fff}
  .tab svg{width:24px;height:24px}
  .badge{position:absolute;margin-top:-26px;margin-left:18px;background:#FF3B30;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 5px;line-height:1}
  .tab-wrap{position:relative}

/* ===== FIX: topbar fixed + touch targets + Agon nav ===== */
.phone{width:min(390px,100%);overflow:hidden}
@media(max-width:430px){.phone{width:100%}}
.topbar{position:fixed;top:0;left:max(0px,calc(50vw - 195px));width:min(100%,390px);height:auto;min-height:56px;padding:max(12px,env(safe-area-inset-top)) 12px 8px;z-index:50}
.btn-circle,.top-right .btn-circle{width:48px;height:48px;min-width:48px;min-height:48px;font-size:22px}
.retour{top:calc(max(12px,env(safe-area-inset-top)) + 64px);min-height:44px;display:flex;align-items:center;padding:0 16px}
.play{width:80px;height:80px}
.rail{right:16px;gap:16px;align-items:center;bottom:340px}
.rail-item{min-width:56px;gap:2px}
.rail-icon{width:56px;height:56px;min-width:56px;min-height:56px}
.rail-icon svg{width:30px;height:30px}
.rail-label{display:none}
.rail-item>span[style]{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.35)}
.info{bottom:226px;right:88px}
.follow{min-height:44px;padding:0 14px}
.nav-agon{position:absolute;left:12px;right:12px;bottom:170px;height:48px;display:flex;gap:8px;z-index:20}
.nav-agon button{flex:1;min-height:48px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 6px}
.nav-agon button:active{background:#FFD700;color:#000}
.player-bar{bottom:118px}
.fullscreen{min-height:44px;padding:0 14px}
.citizen-bar{height:48px;padding:0 8px;bottom:62px}
.citizen-bar .name{max-width:64px}
.pill{min-height:44px;padding:0 10px}
.tabbar{min-height:56px;height:auto}
.tab{min-height:56px;min-width:64px;justify-content:center}
@media(max-height:820px){.rail-count{display:none}}

/* ===== Import / compress sheet ===== */
.up-open{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 116px);z-index:10;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.48);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.up-sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#111;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.up-sheet[hidden]{display:none}
.up-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.up-head button{width:44px;height:44px;border-radius:50%;border:none;background:#222;color:#fff;font-size:20px}
.up-modes{display:flex;gap:8px}
.up-modes button{flex:1;min-height:52px;border-radius:14px;border:2px solid #333;background:#1a1a1a;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.up-modes button.on{border-color:#FFD700;background:#2a2410}
.up-pick{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:#FFD700;color:#000;font-weight:800;font-size:14px;cursor:pointer}
.up-pick.dis{opacity:.4;pointer-events:none}
.up-track{height:10px;border-radius:999px;background:#333;overflow:hidden}
#up-bar{height:100%;width:0;background:#FFD700;transition:width .2s}
#up-label{font-size:13px;min-height:18px}
#up-result{font-size:13.5px;font-weight:700;display:flex;flex-direction:column;gap:8px}
.up-dl{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;border:1px solid #fff;color:#fff;text-decoration:none;font-size:13px}
.brand-footer{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#8A8A8A;z-index:11;padding:2px 8px;background:rgba(0,0,0,.6)}
.brand-footer a{color:#bbb;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <div class="video-wrap">
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="Clip">
    <video id="vid" src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" poster="" playsinline muted loop></video>
  </div>
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  <div class="topbar">
    <div class="top-left">
      <button class="btn-circle">≡</button>
      <div class="top-title">{{BRAND_NAME}}</div>
    </div>
    <div class="top-right">
      <button class="btn-circle">⌕</button>
      <button class="btn-circle">…</button>
    </div>
  </div>
  <div class="retour">Retour</div>
  <button class="play" onclick="document.getElementById('vid').play();document.querySelector('.video-wrap img').style.display='none';this.style.display='none'">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="rail">
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C1 8 3 4.5 6.5 4.5c2 0 3.5 1 4.5 2.5 1-1.5 2.5-2.5 4.5-2.5C19 4.5 21 8 19.5 12c-2.5 4.5-7.5 9-7.5 9z"/></svg></span><span class="rail-label">Like</span><span class="rail-count">3</span></button>
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 12a8 8 0 0 1-11 7.5L3 21l1.5-4A8 8 0 1 1 21 12z"/></svg></span><span class="rail-label">Comment</span><span class="rail-count">0</span></button>
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg></span><span class="rail-label">Partage</span><span class="rail-count">1</span></button>
    <button class="rail-item"><span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span><span class="rail-label">Save</span><span class="rail-count">0</span></button>
    <button class="rail-item"><span style="font-size:22px">•••</span></button>
  </div>
  <div class="info">
    <div class="user-row">
      <div class="avatar">EL</div>
      <div class="user-name">El Qaisy Abdelmalik</div>
      <button class="follow">Suivre</button>
    </div>
    <div class="desc">VID_20260831_211340 petit poussin 🐥</div>
    <div class="music">♫ Musique originale - El Qaisy Abdelmalik</div>
  </div>
  <button class="up-open" id="up-open">⬆ Importer</button>
  <div class="up-sheet" id="up-sheet" hidden>
    <div class="up-head"><span>Importer une vidéo</span><button id="up-close">✕</button></div>
    <div class="up-modes">
      <button data-mode="powder">بودرة ⚡<br><small>480p · 500 kbps</small></button>
      <button data-mode="normal" class="on">جودة عادية<br><small>720p · 1 Mbps</small></button>
    </div>
    <label class="up-pick" id="up-pick">Choisir une vidéo<input type="file" id="up-file" accept="video/*" hidden></label>
    <div class="up-track"><div id="up-bar"></div></div>
    <div id="up-label"></div>
    <div id="up-result"></div>
  </div>
  <div class="nav-agon">
    <button id="prev">Précédent ↑</button>
    <button id="next">Suivant ↓</button>
    <button id="redo">Redo 3x</button>
    <button id="pause">Pause</button>
  </div>
  <div class="player-bar">
    <span class="time">0:00 / 1:07</span>
    <button class="fullscreen">⛶ Plein écran</button>
    <span style="display:flex;gap:14px;font-size:16px">🔊 ⋮</span>
  </div>
  <div class="citizen-bar">
    <div class="mini">EL</div>
    <div class="name">@El Qaisy Abdelmalik</div>
    <button class="pill pill-beige">Citizen card</button>
    <button class="pill pill-beige">Message</button>
    <button class="pill pill-dark">Ask AI</button>
  </div>
  <div class="tabbar">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10H3z"/></svg>Accueil</button>
    <button class="tab active"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>{{TAB_LABEL}}</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Recherche</button>
    <button class="tab"><div class="tab-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 7l9 6 9-6"/></svg><span class="badge">14</span></div>Boîte de réception</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>Profil</button>
  </div>
  <div class="brand-footer">{{BRAND_NAME}} by <a href="{{PARENT_URL}}" target="_blank" rel="noopener">{{PARENT_BRAND}}</a> · <a href="{{PARENT_URL}}" target="_blank" rel="noopener">www.gdnaarena.app</a></div>
</div>
<script>
(function(){
  var v=document.getElementById('vid'),img=document.querySelector('.video-wrap img'),pl=document.querySelector('.play');
  function start(){img.style.display='none';pl.style.display='none';return v.play();}
  document.getElementById('pause').onclick=function(){
    if(v.paused){start();this.textContent='Pause';}else{v.pause();this.textContent='Lecture';}
  };
  document.getElementById('prev').onclick=function(){v.currentTime=0;};
  document.getElementById('next').onclick=function(){v.currentTime=0;};
  var redo=document.getElementById('redo');
  redo.onclick=function(){
    var n=3;v.loop=false;v.currentTime=0;start();redo.textContent='Redo '+n+'x';
    v.onended=function(){n--;if(n>0){redo.textContent='Redo '+n+'x';v.currentTime=0;v.play();}else{v.onended=null;v.loop=true;redo.textContent='Redo 3x';}};
  };
})();
</script>
<script type="module" src="/upload.js"></script>
</body>
</html>
