<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="build-id" content="{{BUILD_ID}}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND_NAME}}</title>
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:site_name" content="{{BRAND_NAME}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PAGE_URL}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="arena-base" content="{{CANONICAL_URL}}">
<meta name="arena-brand" content="{{BRAND_NAME}}">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{gold:'#FFD700'}}}}</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="/upload.css?v={{BUILD_ID}}">
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
  .txs{text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .ico svg{width:100%;height:100%}
  .rail-btn.on svg{fill:#ff2d55;stroke:#ff2d55}
  .rail-btn.saved svg{fill:#FFD700;stroke:#FFD700}
  .tab.active{color:#fff}.tab{color:rgba(255,255,255,.65)}
  .slide-up{animation:slu .28s ease-out}.slide-down{animation:sld .28s ease-out}
  @keyframes slu{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sld{from{transform:translateY(-100%)}to{transform:none}}
  .up-sheet,.sh-sheet{z-index:70}
</style>
</head>
<body>
<div id="phone" class="relative mx-auto h-[100dvh] w-full max-w-[480px] overflow-hidden bg-black text-white font-sans">

  <!-- Media: real clip from R2 (poster first, then the video) -->
  <img id="poster" alt="" class="absolute inset-0 h-full w-full object-cover hidden">
  <video id="vid" class="absolute inset-0 h-full w-full object-cover" autoplay loop muted playsinline preload="auto"></video>
  <div class="pointer-events-none absolute inset-x-0 top-0 h-36 bg-gradient-to-b from-black/70 to-transparent"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 h-72 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
  <div id="empty" class="absolute inset-0 hidden items-center justify-center px-8 text-center text-white/80">Aucun clip pour le moment. Appuyez sur Importer pour publier le premier.</div>

  <!-- Header: Menu | logo | Importer, then the one search bar -->
  <header class="absolute inset-x-0 top-0 z-30 px-3 pt-[calc(env(safe-area-inset-top)+8px)]">
    <div class="grid h-12 grid-cols-[1fr_auto_1fr] items-center">
      <button id="b-menu" aria-label="Menu" class="flex h-11 w-11 items-center justify-center justify-self-start rounded-full"><i data-lucide="menu" class="h-7 w-7"></i></button>
      <div class="flex items-center gap-2 text-xl font-extrabold tracking-tight txs"><i data-lucide="clapperboard" class="h-6 w-6 text-gold"></i><span>Arena Clips</span></div>
      <button id="up-open" aria-label="Importer" class="flex h-11 items-center gap-1.5 justify-self-end rounded-full bg-black/45 px-3 text-sm font-bold backdrop-blur"><i data-lucide="upload" class="h-5 w-5"></i>Importer</button>
    </div>
    <form id="search-form" role="search" action="javascript:void(0)" class="mt-1 flex h-10 items-center gap-2 rounded-full bg-black/45 px-3 backdrop-blur">
      <i data-lucide="search" class="h-5 w-5 shrink-0"></i>
      <input id="q" type="search" placeholder="Rechercher un clip ou un créateur" enterkeyhint="search" autocomplete="off" aria-label="Recherche" class="min-w-0 flex-1 bg-transparent text-sm text-white placeholder-white/80 outline-none">
    </form>
  </header>

  <!-- Right rail: Like, Comment, Share, Save (all stored in the database) -->
  <aside class="absolute right-3 z-20 flex flex-col items-center gap-5 bottom-[calc(env(safe-area-inset-bottom)+232px)]">
    <button id="r-like" class="rail-btn flex w-14 flex-col items-center gap-1" aria-label="J'aime"><i data-lucide="heart" class="h-8 w-8"></i><span class="text-xs font-bold txs" data-n>0</span></button>
    <button id="r-comment" class="rail-btn flex w-14 flex-col items-center gap-1" aria-label="Commentaires"><i data-lucide="message-circle" class="h-8 w-8"></i><span class="text-xs font-bold txs" data-n>0</span></button>
    <button id="r-share" class="rail-btn flex w-14 flex-col items-center gap-1" aria-label="Partager"><i data-lucide="share-2" class="h-8 w-8"></i><span class="text-xs font-bold txs">Partager</span></button>
    <button id="r-save" class="rail-btn flex w-14 flex-col items-center gap-1" aria-label="Enregistrer"><i data-lucide="bookmark" class="h-8 w-8"></i><span class="text-xs font-bold txs" data-n>0</span></button>
  </aside>

  <!-- Bottom: creator + Follow (one place), caption, music, tools, navigation -->
  <section class="absolute inset-x-0 z-20 px-3 bottom-[calc(env(safe-area-inset-bottom)+128px)] pr-20">
    <div class="flex items-center gap-2">
      <div id="avatar" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 border-white bg-gold text-sm font-extrabold text-black">AC</div>
      <div id="author" class="min-w-0 truncate text-[15px] font-bold txs"></div>
      <button id="follow" class="shrink-0 rounded-full border border-white px-3 py-1 text-xs font-bold">Suivre</button>
    </div>
    <p id="caption" class="mt-2 line-clamp-2 text-sm leading-snug txs"></p>
    <p id="music" class="mt-1.5 flex items-center gap-1.5 truncate text-xs opacity-90 txs"><i data-lucide="music-2" class="h-3.5 w-3.5 shrink-0"></i><span class="truncate"></span></p>
  </section>

  <div class="absolute inset-x-3 z-20 flex gap-2 bottom-[calc(env(safe-area-inset-bottom)+72px)]">
    <button id="t-card" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-full bg-[#F3E6B8] text-[13px] font-bold text-neutral-900"><i data-lucide="id-card" class="h-4 w-4"></i>Carte Citoyen</button>
    <button id="t-msg" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-full bg-[#F3E6B8] text-[13px] font-bold text-neutral-900"><i data-lucide="send" class="h-4 w-4"></i>Message</button>
    <button id="t-ai" class="flex h-11 flex-1 items-center justify-center gap-1.5 rounded-full bg-neutral-900 text-[13px] font-bold text-white ring-1 ring-white/25"><i data-lucide="sparkles" class="h-4 w-4 text-gold"></i>Demander à l'IA</button>
  </div>

  <nav class="absolute inset-x-0 bottom-0 z-40 flex h-[calc(64px+env(safe-area-inset-bottom))] items-start border-t border-white/10 bg-black/70 pb-[env(safe-area-inset-bottom)] backdrop-blur">
    <button class="tab active flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="home"><i data-lucide="house" class="h-6 w-6"></i>Accueil</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="search"><i data-lucide="search" class="h-6 w-6"></i>Recherche</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="clips"><i data-lucide="clapperboard" class="h-6 w-6"></i>Clips</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="messages"><i data-lucide="mail" class="h-6 w-6"></i>Messages</button>
    <button class="tab flex h-16 flex-1 flex-col items-center justify-center gap-1 text-[11px]" data-tab="profile"><i data-lucide="user-round" class="h-6 w-6"></i>Profil</button>
  </nav>

  <!-- Pages: Recherche, Clips, Messages, Profil -->
  <main id="page" hidden class="absolute inset-x-0 bottom-[calc(64px+env(safe-area-inset-bottom))] top-[calc(env(safe-area-inset-top)+108px)] z-25 overflow-y-auto bg-neutral-950 p-4" style="z-index:25"></main>

  <!-- Modal layer (comments, citizen card, message, Ask AI, menu, share toast) -->
  <div id="back" hidden class="absolute inset-0 z-50 bg-black/60"></div>
  <div id="modal" hidden class="absolute inset-x-0 bottom-0 z-[60] max-h-[85%] overflow-y-auto rounded-t-3xl bg-neutral-900 p-4 pb-[calc(env(safe-area-inset-bottom)+16px)] shadow-2xl"></div>
  <div id="toast" hidden class="absolute inset-x-4 bottom-[calc(env(safe-area-inset-bottom)+130px)] z-[80] rounded-xl bg-gold px-4 py-2.5 text-center text-sm font-bold text-black"></div>

  <!-- Importer (upload studio, handled by upload.js) -->
  <div class="up-sheet" id="up-sheet" hidden>
    <div class="up-head"><span id="up-title">Nouveau clip</span><button id="up-close" aria-label="Fermer">✕</button></div>
    <div class="st-step" id="st-1">
      <label class="up-pick" id="up-pick">Choisir un fichier vidéo<input type="file" id="up-file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden></label>
    </div>
    <div class="st-step" id="st-2" hidden>
      <video id="st-prev" class="st-prev" playsinline controls loop></video>
      <div class="st-lbl">Description</div>
      <textarea id="st-desc" placeholder="Description…"></textarea>
      <div class="st-lbl">Commentaire</div>
      <textarea id="st-comment" placeholder="Commentaire…"></textarea>
      <div class="st-lbl">Musique</div>
      <div class="st-music">
        <button id="st-music-btn">♫ Choisir une musique</button>
        <button id="st-music-del" hidden title="Supprimer la musique">🗑</button>
      </div>
      <div class="mu-panel" id="mu-panel" hidden>
        <input id="mu-q" type="search" placeholder="Rechercher une musique…">
        <div class="mu-list" id="mu-list"></div>
      </div>
      <div class="ai">
        <div class="ai-title">✨ Assistant IA</div>
        <div class="ai-reply" id="ai-reply">Analyse de la vidéo…</div>
        <div class="ai-list" id="ai-list"></div>
        <div class="ai-chips">
          <button data-q="Propose-moi une description">Description</button>
          <button data-q="Propose-moi un commentaire">Commentaire</button>
          <button data-q="Améliore l'image">Améliorer l'image</button>
          <button data-q="Quelle musique conviendrait ?">Musique</button>
          <button data-q="Transforme la vidéo en cartoon">Cartoon</button>
          <button data-q="Incarne un personnage">Personnage</button>
        </div>
        <div class="ai-ask"><input id="ai-q" placeholder="Demandez à l'IA…"><button id="ai-mic" title="Dictée vocale">🎤</button><button id="ai-send" title="Envoyer">➤</button></div>
      </div>
      <button class="st-pub" id="st-pub">Publier</button>
    </div>
    <div class="up-track"><div id="up-bar"></div></div>
    <div id="up-label"></div>
    <div id="up-result"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var BASE=document.querySelector('meta[name=arena-base]').content.replace(/\/+$/,'');
  var FALLBACK='Découvrez ce nouveau clip sur Arena Clips !';
  var v=$('vid'),poster=$('poster'),page=$('page'),modal=$('modal'),back=$('back');
  var clips=[],seen={},i=0,next=null,busy=false,tab='home';

  /* ---------- helpers ---------- */
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function icons(){if(window.lucide)lucide.createIcons();}
  function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400);}
  function api(method,url,body){
    return fetch(url,{method:method,credentials:'same-origin',cache:'no-store',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||'Une erreur est survenue');return j;});});
  }
  // Strip camera file names (VID_2025..., IMG_...), file extensions and long digit runs; fall back to the default line.
  function cleanCaption(t){
    var s=String(t||'')
      .replace(/\b(?:VID|IMG|MOV|MVI|PXL|DSC|PIC|WA|Screenrecording|Screen[ _-]?Recording)[-_ ]*\d[\d_\s-]*/gi,' ')
      .replace(/\.(?:mp4|mov|webm)\b/gi,' ')
      .replace(/\b\d{4}[-_.]\d{2}[-_.]\d{2}\b/g,' ')
      .replace(/\b\d{2}[.:]\d{2}[.:]\d{2}\b/g,' ')
      .replace(/\d{6,}/g,' ')
      .replace(/\s+/g,' ').replace(/^[\s_.\-–—:,;]+|[\s_.\-–—:,;]+$/g,'');
    return s||FALLBACK;
  }
  var cap=function(c){return cleanCaption(c.description||c.title||'')};
  var cur=function(){return clips[i]};
  var initials=function(n){return String(n||'AC').split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()||'AC'};
  function copyText(t){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(function(){fb(t)});
    fb(t);return Promise.resolve();
  }
  function fb(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();}
  function ago(d){var s=(Date.now()-new Date(d))/1000;if(s<60)return 'à l’instant';if(s<3600)return 'il y a '+Math.floor(s/60)+' min';if(s<86400)return 'il y a '+Math.floor(s/3600)+' h';return 'il y a '+Math.floor(s/86400)+' j';}

  /* ---------- feed (from /api/clips, database order) ---------- */
  function add(list,top){
    if(top){list.forEach(function(c){if(seen[c.id])clips=clips.filter(function(x){return x.id!==c.id});seen[c.id]=1});clips=list.concat(clips);}
    else list.forEach(function(c){if(!seen[c.id]){seen[c.id]=1;clips.push(c)}});
  }
  function more(){
    if(busy||!next)return;busy=true;
    fetch('/api/clips?limit=10&before='+encodeURIComponent(next),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){add(d.clips||[]);next=d.next;}).catch(function(){}).then(function(){busy=false});
  }
  var deep=(location.pathname.match(/^\/c\/([\w.-]+)/)||[])[1];
  var first=deep?fetch('/api/clips/'+encodeURIComponent(deep),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}):Promise.resolve(null);
  Promise.all([first,fetch('/api/clips?limit=10',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})]).then(function(a){
    var one=a[0],d=a[1];
    if(deep&&!one){$('empty').textContent='Ce clip est introuvable.';$('empty').classList.remove('hidden');$('empty').classList.add('flex');return;}
    if(one)add([one]);
    if(d){add(d.clips||[]);next=d.next;}
    if(clips.length)show(0);else{$('empty').classList.remove('hidden');$('empty').classList.add('flex');}
  });

  var nv=document.createElement('video');nv.preload='auto';nv.muted=true;nv.setAttribute('playsinline','');
  var np=new Image();
  function show(dir){
    var c=cur();if(!c)return;
    if(c.poster){poster.src=c.poster;poster.classList.remove('hidden');v.poster=c.poster;}else poster.classList.add('hidden');
    v.src=c.url;v.load();
    v.addEventListener('playing',function h(){v.removeEventListener('playing',h);poster.classList.add('hidden');});
    var p=v.play();if(p&&p.catch)p.catch(function(){});
    var n=clips[i+1];if(n){if(nv.src!==n.url){nv.src=n.url;nv.load();}if(n.poster)np.src=n.poster;}else nv.removeAttribute('src');
    if(i>=clips.length-3)more();
    paint();
    if(dir){v.classList.remove('slide-up','slide-down');void v.offsetWidth;v.classList.add(dir>0?'slide-up':'slide-down');}
  }
  function paint(){
    var c=cur();if(!c)return;
    var name=(c.author&&c.author.name)||'Arena Clips';
    $('author').textContent=name;$('avatar').textContent=initials(name);
    $('caption').textContent=cap(c);
    $('music').lastElementChild.textContent=c.music?c.music.name+(c.music.artist?' - '+c.music.artist:''):'Son original - '+name;
    var vw=c.viewer||{};
    $('r-like').classList.toggle('on',!!vw.liked);$('r-like').querySelector('[data-n]').textContent=c.likes||0;
    $('r-save').classList.toggle('saved',!!vw.saved);$('r-save').querySelector('[data-n]').textContent=c.saves||0;
    $('r-comment').querySelector('[data-n]').textContent=c.comments||0;
    var f=$('follow');f.textContent=vw.following?'Abonné':'Suivre';f.classList.toggle('bg-white',!!vw.following);f.classList.toggle('text-black',!!vw.following);
  }
  function go(d){var n=i+d;if(n<0||n>=clips.length)return;i=n;show(d);}
  function openClip(c){
    if(!seen[c.id]){seen[c.id]=1;clips.splice(i+1,0,c);i=i+1;}else i=clips.findIndex(function(x){return x.id===c.id});
    setTab('home');show(0);
  }
  window.__arena={add:function(c){add([c],true);i=0;show(0);},home:function(){setTab('home');},clips:function(){return clips},cur:function(){return i}};

  /* gestures */
  var y0=null,x0=0,ph=$('phone');
  ph.addEventListener('touchstart',function(e){if(e.target.closest('button,a,input,textarea,main,.up-sheet,#modal,header,nav'))return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;},{passive:true});
  ph.addEventListener('touchend',function(e){if(y0===null)return;var dy=e.changedTouches[0].clientY-y0,dx=e.changedTouches[0].clientX-x0;y0=null;if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5)go(dy<0?1:-1);});
  var lock=0;ph.addEventListener('wheel',function(e){if(e.target.closest('main,#modal,.up-sheet'))return;var t=Date.now();if(t-lock<600||Math.abs(e.deltaY)<20)return;lock=t;go(e.deltaY>0?1:-1);},{passive:true});
  document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowDown')go(1);if(e.key==='ArrowUp')go(-1);});
  v.addEventListener('click',function(){v.paused?v.play():v.pause();});

  /* ---------- rail: like / comment / share / save ---------- */
  function toggle(kind,btn){
    var c=cur();if(!c)return;
    var key=kind==='like'?'liked':'saved',cnt=kind==='like'?'likes':'saves',vw=c.viewer||(c.viewer={});
    var on=!vw[key],was=!!vw[key],wasN=c[cnt]||0;
    vw[key]=on;c[cnt]=Math.max(0,wasN+(on?1:-1));paint();
    api('PUT','/api/clips/'+encodeURIComponent(c.id)+'/'+kind,{on:on}).then(function(r){c[cnt]=r.count;if(cur()===c)paint();if(kind==='save')toast(on?'Clip enregistré':'Clip retiré des enregistrements');})
      .catch(function(e){vw[key]=was;c[cnt]=wasN;if(cur()===c)paint();toast(e.message);});
  }
  $('r-like').onclick=function(){toggle('like')};
  $('r-save').onclick=function(){toggle('save')};
  $('r-share').onclick=function(){
    var c=cur();if(!c)return;var url=BASE+'/c/'+encodeURIComponent(c.id);
    copyText(url).then(function(){toast('Lien copié : '+url)});
  };
  $('follow').onclick=function(){
    var c=cur();if(!c)return;var vw=c.viewer||(c.viewer={}),on=!vw.following,h=c.author.handle;
    clips.forEach(function(x){if(x.author.handle===h)(x.viewer||(x.viewer={})).following=on});paint();
    api('PUT','/api/clips/'+encodeURIComponent(c.id)+'/follow',{on:on}).catch(function(e){clips.forEach(function(x){if(x.author.handle===h)x.viewer.following=!on});paint();toast(e.message);});
  };

  /* ---------- modal helpers ---------- */
  function openModal(html,onclose){modal.innerHTML=html;modal.hidden=false;back.hidden=false;icons();modal._close=onclose;var x=modal.querySelector('[data-x]');if(x)x.onclick=closeModal;}
  function closeModal(){modal.hidden=true;back.hidden=true;}
  back.onclick=closeModal;
  var head=function(t){return '<div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-extrabold">'+t+'</h2><button data-x aria-label="Fermer" class="flex h-10 w-10 items-center justify-center rounded-full bg-neutral-800 text-lg">✕</button></div>';};
  var btn='rounded-full bg-gold px-5 py-2.5 text-sm font-extrabold text-black disabled:opacity-40';
  var field='min-w-0 flex-1 rounded-full border border-neutral-700 bg-neutral-800 px-4 py-2.5 text-sm text-white outline-none';

  /* comments drawer (comments table) */
  $('r-comment').onclick=function(){
    var c=cur();if(!c)return;
    openModal(head('Commentaires')+'<div id="cm-list" class="mb-3 flex max-h-[45vh] flex-col gap-2 overflow-y-auto text-sm"><div class="text-neutral-400">Chargement…</div></div><form id="cm-form" class="flex gap-2" action="javascript:void(0)"><input id="cm-in" maxlength="500" autocomplete="off" placeholder="Ajouter un commentaire…" class="'+field+'"><button class="'+btn+'">Envoyer</button></form>');
    var list=$('cm-list');
    function row(m){return '<div class="rounded-xl bg-neutral-800 px-3 py-2"><div class="text-xs font-bold text-gold">'+esc(m.name)+' <span class="font-normal text-neutral-400">'+ago(m.created_at)+'</span></div><div class="break-words">'+esc(m.body)+'</div></div>';}
    api('GET','/api/clips/'+encodeURIComponent(c.id)+'/comments').then(function(r){list.innerHTML=r.comments.length?r.comments.map(row).join(''):'<div class="text-neutral-400">Aucun commentaire pour le moment. Soyez le premier.</div>';list.scrollTop=list.scrollHeight;}).catch(function(e){list.textContent=e.message});
    $('cm-form').onsubmit=function(e){e.preventDefault();var b=$('cm-in').value.trim();if(!b)return;
      api('POST','/api/clips/'+encodeURIComponent(c.id)+'/comments',{body:b}).then(function(r){
        if(!list.querySelector('.rounded-xl'))list.innerHTML='';list.insertAdjacentHTML('beforeend',row({name:'Moi',body:r.body,created_at:r.created_at}));list.scrollTop=list.scrollHeight;
        $('cm-in').value='';c.comments=r.count;if(cur()===c)paint();}).catch(function(e){toast(e.message)});};
  };

  /* Citizen Card (users / clips / follows tables) */
  $('t-card').onclick=function(){
    var c=cur();if(!c)return;
    openModal(head('Carte Citoyen')+'<div id="cc" class="text-sm text-neutral-300">Chargement…</div>');
    api('GET','/api/citizen/'+encodeURIComponent(c.author.handle)).then(function(u){
      $('cc').innerHTML='<div class="rounded-2xl bg-gradient-to-br from-[#FFF3C4] to-[#F3E6B8] p-4 text-neutral-900"><div class="flex items-center gap-3"><div class="flex h-14 w-14 items-center justify-center rounded-full bg-black text-lg font-extrabold text-gold">'+esc(initials(u.name))+'</div><div class="min-w-0"><div class="truncate text-lg font-extrabold">'+esc(u.name)+'</div><div class="text-xs font-semibold opacity-70">@'+esc(u.handle)+'</div></div></div>'+
        '<div class="mt-4 text-xs font-semibold uppercase opacity-60">Identifiant</div><div class="font-mono text-base font-bold">'+esc(u.citizenId)+'</div>'+
        '<div class="mt-4 grid grid-cols-2 gap-3 text-center"><div class="rounded-xl bg-white/60 py-2"><div id="cc-clips" class="text-2xl font-extrabold">'+u.clips+'</div><div class="text-xs">Clips</div></div><div class="rounded-xl bg-white/60 py-2"><div id="cc-fol" class="text-2xl font-extrabold">'+u.followers+'</div><div class="text-xs">Abonnés</div></div></div></div>';
    }).catch(function(e){$('cc').textContent=e.message});
  };

  /* Message (messages table) */
  function composeMessage(c){
    openModal(head('Message à '+esc(c.author.name))+'<form id="mg" class="flex flex-col gap-3" action="javascript:void(0)"><textarea id="mg-b" rows="4" maxlength="1000" placeholder="Écrivez votre message…" class="rounded-2xl border border-neutral-700 bg-neutral-800 p-3 text-sm text-white outline-none"></textarea><button class="'+btn+'">Envoyer</button></form>');
    $('mg').onsubmit=function(e){e.preventDefault();var b=$('mg-b').value.trim();if(!b)return;
      api('POST','/api/messages',{to:c.author.handle,clip:c.id,body:b}).then(function(){closeModal();toast('Message envoyé');}).catch(function(e){toast(e.message)});};
  }
  $('t-msg').onclick=function(){var c=cur();if(c)composeMessage(c);};

  /* Ask AI (/api/ask) with Copier */
  $('t-ai').onclick=function(){
    var c=cur();if(!c)return;
    var chips=[['Hashtags','Propose-moi des hashtags'],['Commentaire','Écris un commentaire pour ce clip'],['Résumé','Résume ce clip'],['Titre','Propose un titre']];
    openModal(head('Demander à l\'IA')+'<div class="mb-3 flex flex-wrap gap-2">'+chips.map(function(x){return '<button type="button" data-p="'+esc(x[1])+'" class="rounded-full border border-neutral-600 bg-neutral-800 px-3 py-1.5 text-xs font-bold">'+x[0]+'</button>'}).join('')+'</div>'+
      '<form id="ai" class="flex gap-2" action="javascript:void(0)"><input id="ai-in" maxlength="500" autocomplete="off" placeholder="Posez votre question sur ce clip…" class="'+field+'"><button id="ai-go" class="'+btn+'">Envoyer</button></form>'+
      '<div id="ai-out" class="mt-3 hidden"><div id="ai-txt" class="whitespace-pre-wrap break-words rounded-2xl bg-neutral-800 p-3 text-sm"></div><button id="ai-copy" class="mt-2 flex items-center gap-1.5 rounded-full border border-neutral-600 px-4 py-2 text-sm font-bold"><i data-lucide="copy" class="h-4 w-4"></i><span>Copier</span></button></div>');
    modal.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){$('ai-in').value=b.dataset.p;$('ai').requestSubmit();};});
    $('ai').onsubmit=function(e){e.preventDefault();var q=$('ai-in').value.trim();if(!q)return;
      $('ai-go').disabled=true;$('ai-out').classList.remove('hidden');$('ai-txt').textContent='Réflexion en cours…';
      api('POST','/api/ask',{prompt:q,clip:{caption:cap(c),author:c.author.name}}).then(function(r){$('ai-txt').textContent=r.reply;}).catch(function(e){$('ai-txt').textContent=e.message}).then(function(){$('ai-go').disabled=false});};
    $('ai-copy').onclick=function(){var t=$('ai-txt').textContent;if(!t||t==='Réflexion en cours…')return;copyText(t).then(function(){var s=$('ai-copy').lastElementChild;s.textContent='Copié ✓';setTimeout(function(){s.textContent='Copier'},1600);});};
  };

  /* ---------- pages + navigation ---------- */
  function setTab(n){tab=n;document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===n)});if(n==='home')page.hidden=true;}
  function tile(c){return '<button data-id="'+esc(c.id)+'" class="relative aspect-[9/14] overflow-hidden rounded-xl bg-neutral-800 text-left">'+(c.poster?'<img src="'+esc(c.poster)+'" loading="lazy" class="h-full w-full object-cover">':'<video src="'+esc(c.url)+'#t=0.1" preload="metadata" muted playsinline class="h-full w-full object-cover"></video>')+'<div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 p-2 text-[11px] leading-tight"><div class="line-clamp-2 font-semibold">'+esc(cap(c))+'</div><div class="mt-0.5 flex items-center gap-1 text-white/70">♥ '+(c.likes||0)+'</div></div></button>';}
  function bindTiles(list){page.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){var c=list.find(function(x){return x.id===b.dataset.id});if(c)openClip(c);};});}
  function pageHead(t){return '<h2 class="mb-3 text-lg font-extrabold">'+t+'</h2>';}
  function rows(list){return list.map(function(c){return '<button data-id="'+esc(c.id)+'" class="mb-2 flex w-full items-center gap-3 rounded-xl bg-neutral-900 p-2 text-left"><div class="h-16 w-12 shrink-0 overflow-hidden rounded-lg bg-neutral-800">'+(c.poster?'<img src="'+esc(c.poster)+'" class="h-full w-full object-cover">':'<video src="'+esc(c.url)+'#t=0.1" preload="metadata" muted playsinline class="h-full w-full object-cover"></video>')+'</div><div class="min-w-0 text-sm"><div class="line-clamp-2 font-semibold">'+esc(cap(c))+'</div><div class="text-xs text-neutral-400">'+esc(c.author.name)+'</div></div></button>';}).join('');}
  function showPage(n){
    closeModal();setTab(n);
    if(n==='home'){return;}
    page.hidden=false;page.scrollTop=0;
    if(n==='search'){$('q').focus();doSearch($('q').value);}
    if(n==='clips'){
      page.innerHTML=pageHead('Clips')+'<div class="grid grid-cols-3 gap-2">'+clips.map(tile).join('')+'</div>'+(next?'<button id="pg-more" class="mt-4 w-full rounded-full border border-neutral-600 py-2.5 text-sm font-bold">Charger plus</button>':'');
      bindTiles(clips);
      var m=$('pg-more');if(m)m.onclick=function(){m.disabled=true;var before=next;fetch('/api/clips?limit=10&before='+encodeURIComponent(before),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){add(d.clips||[]);next=d.next;busy=false;showPage('clips');});};
    }
    if(n==='messages'){
      page.innerHTML=pageHead('Messages')+'<div class="text-sm text-neutral-400">Chargement…</div>';
      api('GET','/api/messages').then(function(r){
        page.innerHTML=pageHead('Messages')+(r.messages.length?r.messages.map(function(m){return '<div class="mb-2 rounded-xl bg-neutral-900 p-3 text-sm"><div class="text-xs font-bold text-gold">'+(m.mine?'Envoyé à ':'De ')+esc(m.other)+' <span class="font-normal text-neutral-400">'+ago(m.created_at)+'</span></div><div class="mt-1 break-words">'+esc(m.body)+'</div></div>';}).join(''):'<div class="text-sm text-neutral-400">Aucun message. Utilisez le bouton Message sous un clip pour écrire à un créateur.</div>');
      }).catch(function(e){page.textContent=e.message});
    }
    if(n==='profile'){
      page.innerHTML=pageHead('Profil')+'<div class="text-sm text-neutral-400">Chargement…</div>';
      api('GET','/api/me').then(function(r){
        page.innerHTML=pageHead('Profil')+'<div class="mb-4 flex items-center gap-3 rounded-2xl bg-neutral-900 p-4"><div class="flex h-12 w-12 items-center justify-center rounded-full bg-gold font-extrabold text-black">V</div><div><div class="font-bold">Visiteur</div><div class="text-xs text-neutral-400">'+r.saved.length+' clip(s) enregistré(s)</div></div></div><h3 class="mb-2 text-sm font-bold text-neutral-300">Clips enregistrés</h3>'+(r.saved.length?'<div class="grid grid-cols-3 gap-2">'+r.saved.map(tile).join('')+'</div>':'<div class="text-sm text-neutral-400">Rien d\'enregistré pour le moment.</div>');
        bindTiles(r.saved);
      }).catch(function(e){page.textContent=e.message});
    }
  }
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){showPage(t.dataset.tab)}});

  /* ---------- the one search bar (database search) ---------- */
  var sT,sSeq=0;
  function doSearch(q){
    q=q.trim();setTab('search');page.hidden=false;
    if(!q){page.innerHTML=pageHead('Recherche')+'<div class="text-sm text-neutral-400">Saisissez un mot-clé ou le nom d\'un créateur.</div>';return;}
    var my=++sSeq;page.innerHTML=pageHead('Recherche')+'<div class="text-sm text-neutral-400">Recherche…</div>';
    fetch('/api/clips?limit=30&q='+encodeURIComponent(q),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      if(my!==sSeq)return;var list=d.clips||[];
      page.innerHTML=pageHead('Résultats ('+list.length+')')+(list.length?rows(list):'<div class="text-sm text-neutral-400">Aucun résultat pour « '+esc(q)+' ».</div>');
      bindTiles(list);
    }).catch(function(){if(my===sSeq)page.innerHTML=pageHead('Recherche')+'<div class="text-sm text-neutral-400">Recherche indisponible.</div>';});
  }
  $('search-form').onsubmit=function(e){e.preventDefault();doSearch($('q').value);$('q').blur();};
  $('q').addEventListener('input',function(){clearTimeout(sT);var q=$('q').value;sT=setTimeout(function(){if(q.trim())doSearch(q);else if(tab==='search')doSearch('');},250);});
  $('q').addEventListener('keydown',function(e){e.stopPropagation();});

  /* ---------- menu (left) ---------- */
  $('b-menu').onclick=function(){
    openModal(head('Menu')+'<div class="flex flex-col gap-2">'+[['home','Accueil','house'],['search','Recherche','search'],['clips','Clips','clapperboard'],['messages','Messages','mail'],['profile','Profil','user-round'],['upload','Importer un clip','upload']].map(function(x){return '<button data-go="'+x[0]+'" class="flex h-12 items-center gap-3 rounded-xl bg-neutral-800 px-4 text-left text-[15px] font-semibold"><i data-lucide="'+x[2]+'" class="h-5 w-5"></i>'+x[1]+'</button>'}).join('')+'</div>');
    modal.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var g=b.dataset.go;closeModal();if(g==='upload')$('up-open').click();else showPage(g);};});
  };
  /* importer: pick the file first (the studio sheet is opened by upload.js) */
  $('up-open').addEventListener('click',function(){var f=$('up-file');if(f)f.click();});
  icons();
  window.addEventListener('load',icons);
})();
</script>
<script type="module" src="/upload.js?v={{BUILD_ID}}"></script>
</body>
</html>
